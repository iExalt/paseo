apply plugin: 'com.android.library'

group = 'sh.paseo.forkupdates'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "sh.paseo.forkupdates"
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Applies APK update deltas made with `zstd --patch-from`. The AAR requires compileSdk 37
  // and carries only Android natives, so unit tests use the plain jar with desktop natives.
  implementation "com.github.luben:zstd-jni:1.6.0-1@aar"
  testImplementation "com.github.luben:zstd-jni:1.6.0-1"
  testImplementation "junit:junit:4.13.2"
}
