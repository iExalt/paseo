apply plugin: 'com.android.library'

group = 'sh.paseo.forkupdates'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "sh.paseo.forkupdates"
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Applies APK update deltas made with `zstd --patch-from`; 1.5.7-13 and later need
  // compileSdk 37. The AAR carries only Android natives, so unit tests use the plain jar,
  // which bundles the desktop ones.
  implementation "com.github.luben:zstd-jni:1.5.7-12@aar"
  testImplementation "com.github.luben:zstd-jni:1.5.7-12"
  testImplementation "junit:junit:4.13.2"
}
