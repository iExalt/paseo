apply plugin: 'com.android.library'
group = 'sh.paseo.notifications'
version = '0.1.0'
def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()
android { namespace "sh.paseo.notifications" }
dependencies {
  implementation "androidx.lifecycle:lifecycle-process:2.11.1"
  if (findProject(':expo-notifications') != null) {
    implementation project(':expo-notifications')
  } else {
    // Expo autolinks prebuilt modules from its local Maven repository.
    def configFile = ["node", "--print", "require.resolve('expo-notifications/expo-module.config.json')"].execute(null, rootDir).text.trim()
    def json = new groovy.json.JsonSlurper()
    def nativeConfig = new File(configFile)
    def publication = json.parse(nativeConfig).android.publication
    def publicationVersion = publication.version ?: json.parse(new File(nativeConfig.parentFile, "package.json")).version
    implementation "${publication.groupId}:${publication.artifactId}:${publicationVersion}"
  }
  testImplementation "junit:junit:4.13.2"
}
