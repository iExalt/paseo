name: Windows package prerequisite

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture for bounded installer ownership proof
        required: true
        type: choice
        default: arm64
        options: [arm64, x64]
      mode:
        description: Full prerequisite or bounded install diagnosis without a workspace install
        required: true
        type: choice
        default: full
        options: [full, diagnostic, fixture-tools, binding-only]

permissions:
  contents: read

concurrency:
  group: windows-package-preflight
  cancel-in-progress: false

jobs:
  prerequisite:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: ${{ inputs.mode == 'binding-only' && 35 || inputs.mode == 'diagnostic' && 10 || inputs.mode == 'fixture-tools' && 25 || 50 }}
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      LEFTHOOK: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          architecture: ${{ inputs.architecture }}
          package-manager-cache: false
      - name: Bind the clean source and runner identity
        run: ./.github/scripts/windows-prerequisite.ps1 setup
      - name: Prove normal, detached-failure and monitor-death ownership
        timeout-minutes: 3
        run: ./.github/scripts/windows-prerequisite.ps1 ownership
      - name: Measure the complete locked install once
        if: inputs.mode == 'full'
        timeout-minutes: 30
        run: ./.github/scripts/windows-prerequisite.ps1 install
      - name: Install only the locked fixture tools
        if: inputs.mode == 'fixture-tools' || inputs.mode == 'binding-only'
        timeout-minutes: 8
        run: ./.github/scripts/windows-prerequisite.ps1 fixture-tools
      - name: Package two tiny native NSIS fixtures
        if: inputs.mode == 'full' || inputs.mode == 'fixture-tools'
        timeout-minutes: 5
        run: ./.github/scripts/windows-prerequisite.ps1 build
      - name: Verify current-user install, replacement, renderer and uninstall
        if: inputs.mode == 'full' || inputs.mode == 'fixture-tools'
        timeout-minutes: 5
        run: ./.github/scripts/windows-prerequisite.ps1 runtime
      - name: Verify build-only telemetry cleanup without a workspace install
        if: inputs.mode == 'diagnostic'
        timeout-minutes: 7
        run: ./.github/scripts/windows-prerequisite.ps1 probe
      - name: Assemble the pinned Electron ARM binding diagnostic
        if: inputs.mode == 'binding-only'
        timeout-minutes: 16
        run: ./.github/scripts/windows-prerequisite.ps1 binding-build
      - name: Diagnose native wrapper and physical addon loading
        if: inputs.mode == 'binding-only'
        timeout-minutes: 2
        run: ./.github/scripts/windows-prerequisite.ps1 binding-runtime
      - name: Verify owned fixture cleanup
        if: always()
        timeout-minutes: 2
        run: ./.github/scripts/windows-prerequisite.ps1 cleanup
      - name: Bound retained diagnostics
        id: diagnostics
        if: always()
        run: ./.github/scripts/windows-prerequisite.ps1 diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: always() && steps.diagnostics.outcome == 'success'
        with:
          name: windows-prerequisite-${{ inputs.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paseo-windows-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          retention-days: 1
          if-no-files-found: error
