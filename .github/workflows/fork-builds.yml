name: Fork release candidate builds

on:
  push:
    branches: [dev]
    paths:
      - ".github/scripts/nix-release-closure.sh"
      - ".github/workflows/fork-android-apk.yml"
      - ".github/workflows/fork-builds.yml"
      - ".github/workflows/macos-closure.yml"
      - ".npmrc"
      - ".tool-versions"
      - "flake.lock"
      - "flake.nix"
      - "mise.toml"
      - "nix/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "plugins/**"
      - "packages/app/**"
      - "packages/cli/**"
      - "packages/client/**"
      - "packages/desktop/**"
      - "packages/expo-two-way-audio/**"
      - "packages/highlight/**"
      - "packages/plugin/**"
      - "packages/protocol/**"
      - "packages/relay/**"
      - "packages/server/**"
      - "scripts/build-daemon-web-ui.mjs"
      - "scripts/build-terminal-webview-html.mjs"
      - "scripts/gradle-resource-watch.sh"
      - "scripts/npm-retry.mjs"
      - "scripts/postinstall-patches.mjs"
      - "scripts/trace-daemon.mjs"
      - "tsconfig.base.json"
      - "tsconfig.json"

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: fork-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Pin paired build identity
    if: github.repository == 'iExalt/paseo' && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      release_sequence: ${{ steps.identity.outputs.release_sequence }}
    steps:
      - name: Validate caller and allocate release sequence
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "iExalt/paseo"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$GITHUB_ACTOR" = "iExalt"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if (( GITHUB_RUN_NUMBER > 2099800000 )); then
            echo "Caller run number exceeds the Android version-code budget." >&2
            exit 1
          fi
          release_sequence=$((200000 + GITHUB_RUN_NUMBER))
          (( release_sequence <= 2100000000 ))
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "release_sequence=$release_sequence" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build and verify macOS closure
    needs: identity
    uses: ./.github/workflows/macos-closure.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      release_sequence: ${{ needs.identity.outputs.release_sequence }}
    secrets:
      PASEO_NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}

  build-android:
    name: Build and sign Android APK
    needs: identity
    uses: ./.github/workflows/fork-android-apk.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      release_sequence: ${{ needs.identity.outputs.release_sequence }}
    secrets:
      PASEO_FORK_GOOGLE_SERVICES_JSON: ${{ secrets.PASEO_FORK_GOOGLE_SERVICES_JSON }}
      PASEO_FORK_SIGNING_KEY_PKCS8_PEM: ${{ secrets.PASEO_FORK_SIGNING_KEY_PKCS8_PEM }}
      PASEO_FORK_SIGNING_CERT_PEM: ${{ secrets.PASEO_FORK_SIGNING_CERT_PEM }}

  candidate-complete:
    name: Cross-check paired candidate artifacts
    needs: [identity, build-macos, build-android]
    if: github.repository == 'iExalt/paseo' && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload-manifest.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-manifest.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.build-android.outputs.artifact_id }}
          path: ${{ runner.temp }}/paired-android
          merge-multiple: true

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact_id }}
          path: ${{ runner.temp }}/paired-macos
          merge-multiple: true

      - name: Verify both artifacts and write normalized candidate manifest
        id: manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          RELEASE_SEQUENCE: ${{ needs.identity.outputs.release_sequence }}
          ANDROID_VERIFIED: ${{ needs.build-android.outputs.verified }}
          ANDROID_SOURCE_SHA: ${{ needs.build-android.outputs.source_sha }}
          ANDROID_RELEASE_SEQUENCE: ${{ needs.build-android.outputs.release_sequence }}
          ANDROID_VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
          ANDROID_PACKAGE_ID: ${{ needs.build-android.outputs.package_id }}
          ANDROID_CERT_SHA256: ${{ needs.build-android.outputs.signing_certificate_sha256 }}
          ANDROID_APK_SHA256: ${{ needs.build-android.outputs.apk_sha256 }}
          ANDROID_METADATA_SHA256: ${{ needs.build-android.outputs.metadata_sha256 }}
          ANDROID_ARTIFACT_NAME: ${{ needs.build-android.outputs.artifact_name }}
          ANDROID_ARTIFACT_ID: ${{ needs.build-android.outputs.artifact_id }}
          ANDROID_ARTIFACT_DIGEST: ${{ needs.build-android.outputs.artifact_digest }}
          MACOS_VERIFIED: ${{ needs.build-macos.outputs.verified }}
          MACOS_SOURCE_SHA: ${{ needs.build-macos.outputs.source_sha }}
          MACOS_RELEASE_SEQUENCE: ${{ needs.build-macos.outputs.release_sequence }}
          MACOS_LOCK_HASH: ${{ needs.build-macos.outputs.lock_hash }}
          MACOS_OUTPUT_PATH: ${{ needs.build-macos.outputs.output_path }}
          MACOS_MANIFEST_PATH: ${{ needs.build-macos.outputs.manifest_path }}
          MACOS_MANIFEST_SHA256: ${{ needs.build-macos.outputs.manifest_sha256 }}
          MACOS_ARCHIVE_SHA256: ${{ needs.build-macos.outputs.archive_sha256 }}
          MACOS_ARTIFACT_NAME: ${{ needs.build-macos.outputs.artifact_name }}
          MACOS_ARTIFACT_ID: ${{ needs.build-macos.outputs.artifact_id }}
          MACOS_ARTIFACT_DIGEST: ${{ needs.build-macos.outputs.artifact_digest }}
          APPROVED_ANDROID_CERT_SHA256: 943626cd89e2d0b763d432db9100110b878953356db9d3e46497be2179989459
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "iExalt/paseo"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$GITHUB_ACTOR" = "iExalt"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$ANDROID_VERIFIED" = true
          test "$MACOS_VERIFIED" = true
          test "$ANDROID_SOURCE_SHA" = "$SOURCE_SHA"
          test "$MACOS_SOURCE_SHA" = "$SOURCE_SHA"
          test "$ANDROID_RELEASE_SEQUENCE" = "$RELEASE_SEQUENCE"
          test "$MACOS_RELEASE_SEQUENCE" = "$RELEASE_SEQUENCE"
          test "$ANDROID_VERSION_CODE" = "$RELEASE_SEQUENCE"
          test "$ANDROID_PACKAGE_ID" = sh.paseo.iexalt
          test "$ANDROID_CERT_SHA256" = "$APPROVED_ANDROID_CERT_SHA256"
          test -n "$ANDROID_ARTIFACT_ID" && test -n "$ANDROID_ARTIFACT_DIGEST"
          test -n "$MACOS_ARTIFACT_ID" && test -n "$MACOS_ARTIFACT_DIGEST"
          android_artifact_attempt="${ANDROID_ARTIFACT_NAME##*-attempt-}"
          macos_artifact_attempt="${MACOS_ARTIFACT_NAME##*-attempt-}"
          for lane_attempt in "$android_artifact_attempt" "$macos_artifact_attempt"; do
            [[ "$lane_attempt" =~ ^[1-9][0-9]*$ ]] \
              || { echo "Invalid platform artifact attempt." >&2; exit 1; }
            (( lane_attempt <= GITHUB_RUN_ATTEMPT )) \
              || { echo "Platform artifact attempt is newer than the selected run." >&2; exit 1; }
          done
          test "$ANDROID_ARTIFACT_NAME" = "paseo-iexalt-${ANDROID_VERSION_CODE}-${SOURCE_SHA}-attempt-${android_artifact_attempt}"
          test "$MACOS_ARTIFACT_NAME" = "paseo-nix-closure-${SOURCE_SHA}-${RELEASE_SEQUENCE}-attempt-${macos_artifact_attempt}"

          android_dir="$RUNNER_TEMP/paired-android"
          macos_dir="$RUNNER_TEMP/paired-macos"
          android_apk="$android_dir/paseo-iexalt-fork-${ANDROID_VERSION_CODE}.apk"
          android_metadata="$android_dir/build-metadata.json"
          macos_archive="$macos_dir/${MACOS_ARTIFACT_NAME}.tar"
          macos_manifest="$macos_dir/manifest.json"
          (cd "$android_dir" && sha256sum -c SHA256SUMS)
          (cd "$macos_dir" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$android_apk" | cut -d' ' -f1)" = "$ANDROID_APK_SHA256"
          test "$(sha256sum "$android_metadata" | cut -d' ' -f1)" = "$ANDROID_METADATA_SHA256"
          test "$(sha256sum "$macos_archive" | cut -d' ' -f1)" = "$MACOS_ARCHIVE_SHA256"
          test "$(sha256sum "$macos_manifest" | cut -d' ' -f1)" = "$MACOS_MANIFEST_SHA256"

          jq -e \
            --arg sourceSha "$SOURCE_SHA" --arg releaseSequence "$RELEASE_SEQUENCE" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$android_artifact_attempt" \
            --arg packageId "$ANDROID_PACKAGE_ID" --arg versionCode "$ANDROID_VERSION_CODE" \
            --arg certSha "$APPROVED_ANDROID_CERT_SHA256" --arg apkSha "$ANDROID_APK_SHA256" \
            '.sourceSha == $sourceSha and .releaseSequence == $releaseSequence
              and .runId == $runId and .signingRunId == $runId
              and (.runAttempt | type == "string" and test("^[1-9][0-9]*$") and tonumber <= ($runAttempt | tonumber))
              and .signingRunAttempt == $runAttempt
              and .packageId == $packageId and .versionCode == $versionCode
              and .signingCertificateSha256 == $certSha and .apkSha256 == $apkSha
              and .abi == "arm64-v8a"' "$android_metadata" >/dev/null
          jq -e \
            --arg sourceSha "$SOURCE_SHA" --arg releaseSequence "$RELEASE_SEQUENCE" \
            --arg lockHash "$MACOS_LOCK_HASH" --arg outputPath "$MACOS_OUTPUT_PATH" \
            '.sourceSha == $sourceSha and (.releaseSequence | tostring) == $releaseSequence
              and .lockHash == $lockHash and .system == "aarch64-darwin"
              and .outputPath == $outputPath and .provenance == "local-ci-build"
              and .nodeSeed.provenance == "local-built-dependency"
              and any(.closure[]; .path == $outputPath)' "$macos_manifest" >/dev/null

          paired_dir="$RUNNER_TEMP/paired-candidate"
          mkdir -p "$paired_dir"
          jq -nS \
            --arg sourceSha "$SOURCE_SHA" --argjson releaseSequence "$RELEASE_SEQUENCE" \
            --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg androidArtifactName "$ANDROID_ARTIFACT_NAME" --arg androidArtifactId "$ANDROID_ARTIFACT_ID" \
            --arg androidArtifactDigest "$ANDROID_ARTIFACT_DIGEST" --arg androidApkSha256 "$ANDROID_APK_SHA256" \
            --arg androidArtifactRunAttempt "$android_artifact_attempt" \
            --arg androidMetadataSha256 "$ANDROID_METADATA_SHA256" --arg androidPackageId "$ANDROID_PACKAGE_ID" \
            --arg androidVersionCode "$ANDROID_VERSION_CODE" --arg androidCertificateSha256 "$ANDROID_CERT_SHA256" \
            --arg macosArtifactName "$MACOS_ARTIFACT_NAME" --arg macosArtifactId "$MACOS_ARTIFACT_ID" \
            --arg macosArtifactDigest "$MACOS_ARTIFACT_DIGEST" --arg macosManifestSha256 "$MACOS_MANIFEST_SHA256" \
            --arg macosArtifactRunAttempt "$macos_artifact_attempt" \
            --arg macosArchiveSha256 "$MACOS_ARCHIVE_SHA256" --arg macosLockHash "$MACOS_LOCK_HASH" \
            --arg macosOutputPath "$MACOS_OUTPUT_PATH" --arg macosManifestPath "$MACOS_MANIFEST_PATH" \
            '{schemaVersion: 1, status: "candidate", sourceSha: $sourceSha,
              releaseSequence: $releaseSequence, runId: $runId, runAttempt: $runAttempt,
              android: {artifactName: $androidArtifactName, artifactId: $androidArtifactId,
                artifactDigest: $androidArtifactDigest, artifactRunAttempt: $androidArtifactRunAttempt,
                apkSha256: $androidApkSha256,
                metadataSha256: $androidMetadataSha256, packageId: $androidPackageId,
                versionCode: $androidVersionCode, signingCertificateSha256: $androidCertificateSha256},
              macOS: {artifactName: $macosArtifactName, artifactId: $macosArtifactId,
                artifactDigest: $macosArtifactDigest, artifactRunAttempt: $macosArtifactRunAttempt,
                manifestSha256: $macosManifestSha256,
                archiveSha256: $macosArchiveSha256, lockHash: $macosLockHash,
                outputPath: $macosOutputPath, manifestPath: $macosManifestPath,
                system: "aarch64-darwin", provenance: "local-ci-build",
                nodeSeedProvenance: "local-built-dependency"}}' \
            > "$paired_dir/paired-candidate.json"
          (cd "$paired_dir" && sha256sum paired-candidate.json > SHA256SUMS)
          echo "manifest_sha256=$(sha256sum "$paired_dir/paired-candidate.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "Candidate complete: both lane outputs match SHA, sequence, signing/package metadata, and artifact pins." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normalized paired candidate manifest
        id: upload-manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paseo-paired-candidate-${{ needs.identity.outputs.release_sequence }}-${{ needs.identity.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-candidate/
          if-no-files-found: error
          retention-days: 7
