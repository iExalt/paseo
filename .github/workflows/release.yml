# tag, plus the Linux x64/arm64 Nix closures and the Windows x64 installer;
# smoke-tests each, signs what clients verify and publishes the GitHub release
# the in-app updaters read. Merging the release PR makes the tag and a
          node-version: "26.13.0"
        run: bash .github/scripts/release-nix.sh build
        run: bash .github/scripts/release-nix.sh export
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      # zstd comes from the pinned nixpkgs, the one the updater's wrapper ships.
      - name: Write the update index and deltas from recent releases
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_PATH: ${{ steps.build.outputs.output_path }}
        run: |
          zstd_bin="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#zstd.bin)/bin"
          PATH="$zstd_bin:$PATH" node .github/scripts/release-mac-index.mjs "$RUNNER_TEMP/paseo-release-macos"
          node-version: "26.13.0"
          # Fetching the pinned nixpkgs for zstd goes through the GitHub API.
          github_access_token: ${{ github.token }}
      # Installs the previous release, then stages this one from its delta.
      # Takes about 2 min; a hang fails here instead of at the job limit.
        timeout-minutes: 5
          PUBLISH: ${{ needs.resolve.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          zstd_bin="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#zstd.bin)/bin"
          PATH="$zstd_bin:$PATH" node .github/scripts/release-mac-smoke.mjs "$RUNNER_TEMP/paseo-release-macos"
          path: ${{ runner.temp }}/paseo-desktop-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the primary Mac/Android inventory for installed clients. The signed
  # desktop sidecar binds Linux/Windows assets for updater-capable clients; older
  # clients need one manual bootstrap installation.
  linux-build:
    name: Build and sign Linux Nix closure (${{ matrix.arch }})
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the CLI and desktop closure
        timeout-minutes: 60
        run: bash .github/scripts/release-nix.sh build
      - name: Sign and export the binary cache
        timeout-minutes: 15
        env:
          NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}
        run: bash .github/scripts/release-nix.sh export
      - name: Remove the Nix signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/paseo-nix-release-secret-key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/paseo-release-linux/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  linux-smoke:
    name: Install and launch Linux closure on a fresh runner (${{ matrix.arch }})
    needs: [resolve, linux-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/paseo-release-linux
      - name: Install smoke harness dependencies and Xvfb
        timeout-minutes: 5
        run: |
          node .github/scripts/release-mac-smoke-deps.mjs "$RUNNER_TEMP/paseo-smoke-deps"
          command -v xvfb-run > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth; }
      # Takes under a minute; a hang fails here instead of at the job limit.
      - name: Import with the release key alone, then check the CLI and launch
        timeout-minutes: 4
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          PLATFORM: linux-${{ matrix.arch }}
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/paseo-desktop-smoke
        run: node .github/scripts/release-linux-smoke.mjs "$RUNNER_TEMP/paseo-release-linux"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: release-linux-${{ matrix.arch }}-smoke
          path: ${{ runner.temp }}/paseo-desktop-smoke/
          if-no-files-found: ignore
          retention-days: 7

  # The NSIS installer is unsigned: there is no Windows publisher certificate.
  windows-build:
    name: Build and smoke-test Windows x64 installer
    needs: [resolve]
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      CI: "true"
      LEFTHOOK: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"
      - name: Install JavaScript dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/npm-retry.mjs ci
      - name: Exercise Windows update recovery before packaging
        timeout-minutes: 3
        run: |
          npm run build:protocol
          npx vitest run --root packages/desktop --bail=1 \
            src/features/windows-fork-updater.test.ts \
            src/features/auto-updater.test.ts \
            src/features/app-update-service.test.ts \
            src/features/windows-update-safety.test.ts
      # afterPack smoke-tests the unpacked app (packages/desktop/scripts/after-pack.js).
      - name: Build the installer and smoke-test the unpacked app
        timeout-minutes: 30
        env:
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/paseo-desktop-smoke
        run: npm run build:desktop -- --publish never --win nsis --x64
      - name: Install silently and check the installed CLI
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "packages/desktop/release/Paseo-Setup-$env:VERSION-x64.exe"
          $dir = Join-Path $env:RUNNER_TEMP "paseo-install"
          # NSIS takes /D last and unquoted.
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The installer exited with $($process.ExitCode)." }
          if (-not (Test-Path (Join-Path $dir "Paseo.exe"))) { throw "The installer left no Paseo.exe in $dir." }
          $cliVersion = & cmd.exe /d /c "`"$dir\resources\bin\paseo.cmd`" --version"
          if ($LASTEXITCODE -ne 0 -or -not ($cliVersion -contains $env:VERSION)) { throw "The installed CLI reports $cliVersion." }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/release-windows" | Out-Null
          Copy-Item $installer "$env:RUNNER_TEMP/release-windows/paseo-$env:VERSION-windows-x64.exe"
          Write-Output "Installed to $dir; CLI $cliVersion"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/release-windows/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: release-windows-x64-smoke
          node-version: "26.13.0"
          java-version: "27.0.1"
          grep -qF 'gradle-9.8.2-bin.zip' packages/app/android/gradle/wrapper/gradle-wrapper.properties
          # The updater's gunzip test rides on this run: a separate Gradle run would pay
          # configuration again, but here it adds only its own compile and three tests.
            :paseo-fork-updates:testReleaseUnitTest \
          java-version: "27.0.1"
          # Unsigned download sidecar: the APK stores its dex, .so and JS uncompressed, so
          # deflate cuts the transfer by about 60%. Clients check the gunzipped bytes against
          # the signed manifest and fall back to the APK. -n keeps the output reproducible.
          gzip -9 -n -c "$apk" > "$apk.gz"
  # Unsigned APK deltas from recent releases. They only save bandwidth, so this job never
  # holds up the release: every failure is a warning, and publish runs without them.
  android-delta:
    name: Make APK deltas from recent releases
    needs: [resolve, android-sign]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            scripts
            packages/protocol/src
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-android
          path: ${{ runner.temp }}/release-android
      # About a minute and 1.5 GB per base at --ultra -22; the runner's zstd is enough to encode.
      - name: Write deltas against the signed APKs of recent releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release-android-delta.mjs \
            "$RUNNER_TEMP/release-android/paseo-$VERSION-android-arm64.apk" "$RUNNER_TEMP/release-android-delta"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android-delta
          path: ${{ runner.temp }}/release-android-delta/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0

    needs:
      [
        resolve,
        macos-build,
        macos-smoke,
        linux-build,
        linux-smoke,
        windows-build,
        android-build,
        android-sign,
        android-delta,
      ]
    # Waits for android-delta but does not need it to succeed.
    if: >-
      !cancelled() && needs.resolve.result == 'success' && needs.macos-build.result == 'success' &&
      needs.macos-smoke.result == 'success' && needs.linux-build.result == 'success' &&
      needs.linux-smoke.result == 'success' && needs.windows-build.result == 'success' &&
      needs.android-build.result == 'success' && needs.android-sign.result == 'success'
          node-version: "26.13.0"
          pattern: release-{macos,android,android-delta,linux-x64,linux-arm64,windows-x64}
