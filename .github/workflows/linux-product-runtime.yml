name: Linux product formats

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.native.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.native.outputs.artifact_digest }}
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture for installed product upgrades
        type: choice
        required: true
        default: x64
        options: [x64, arm64]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ inputs.source_sha && format('candidate-products-{0}-{1}', 'linux', inputs.architecture) || 'paseo-predecessor-cache-writer' }}
  cancel-in-progress: false

jobs:
  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: linux-products-${{ inputs.architecture }}

  native:
    needs: [authorize]
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || inputs.source_sha == '') && (github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && (github.actor == 'iExalt' || (inputs.source_sha != '' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'))) }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
      artifact_digest: ${{ steps.packages.outputs.artifact-digest }}
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_LIVE_NATIVE: ${{ vars.PASEO_CANDIDATE_NATIVE_ENABLED }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: linux-products-${{ inputs.architecture }}
      CANDIDATE_EXPECTED_JOB: linux-products (${{ inputs.architecture }}) / native
      PASEO_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      CI: "true"
      LEFTHOOK: "0"
      npm_config_audit: "false"
      npm_config_fund: "false"
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        if: inputs.source_sha != ''
        id: candidate
        env:
          CANDIDATE_EXPECTED_JOB: linux-products (${{ inputs.architecture }}) / native
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        id: source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the immutable predecessor recipe
        id: predecessor
        run: node .github/scripts/linux-predecessor-cache.mjs prepare
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: predecessor-cache
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ steps.predecessor.outputs.key }}
      - name: Report a predecessor cache miss
        if: inputs.source_sha != '' && steps.predecessor-cache.outputs.cache-hit != 'true'
        run: echo "::warning::Predecessor cache missed; rebuilding it. Prewarm with a no-source dispatch on dev."
      - name: Build each exact source once and fan out native formats
        timeout-minutes: 30
        env:
          PREDECESSOR_CACHE_HIT: ${{ steps.predecessor-cache.outputs.cache-hit }}
          PREDECESSOR_CACHE_MATCHED_KEY: ${{ steps.predecessor-cache.outputs.cache-matched-key }}
        run: bash .github/scripts/linux-product-build.sh
      - name: Reserve headroom before saving the predecessor
        if: inputs.source_sha == '' && steps.predecessor-cache.outputs.cache-hit != 'true'
        id: cache-budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/linux-predecessor-cache.mjs budget
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: predecessor-save
        if: steps.cache-budget.outputs.save == 'true'
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ steps.predecessor.outputs.key }}
      - name: Verify installed product upgrades and preserved state
        id: verify
        timeout-minutes: 10
        run: bash .github/scripts/linux-product-runtime.sh
      - name: Clean owned installations, containers and state
        id: cleanup
        if: always()
        timeout-minutes: 2
        run: bash .github/scripts/linux-product-cleanup.sh
      - name: Export verified candidate packages
        if: success() && inputs.source_sha != ''
        id: export
        env:
          CANDIDATE_CONTEXT: ${{ steps.candidate.outputs.context }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
        run: node .github/scripts/candidate-product-export.mjs linux
      - name: Transfer immutable candidate packages
        if: success() && inputs.source_sha != ''
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-linux-products-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.export.outputs.directory }}/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Bind step proof to this run attempt
        id: proof-subject
        if: steps.candidate.outcome == 'success' && steps.source.outcome == 'success' && steps.verify.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.export.outcome == 'success' && steps.packages.outcome == 'success'
        env:
          PROOF_SLOT: producer-linux-products-${{ inputs.architecture }}
        shell: bash
        run: |
          [[ "$PROOF_SLOT" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]
          subject="$RUNNER_TEMP/paseo-step-proof-$PROOF_SLOT"
          printf 'paseo-step-proof-v1\n%s\n%s\n%s\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROOF_SLOT" > "$subject"
          { echo "subject=$subject"; echo "slot=$PROOF_SLOT"; } >> "$GITHUB_OUTPUT"
      - name: Sign step proof
        if: steps.proof-subject.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.proof-subject.outputs.subject }}
          predicate-type: https://github.com/iExalt/paseo/attestations/step-proof/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-step-proof","repository":"{0}","runId":{1},"attempt":{2},"slot":"{3}","evidence":{4}}}', github.repository, github.run_id, github.run_attempt, steps.proof-subject.outputs.slot, format('{{"artifactId":{0},"artifactDigest":"{1}"}}', steps.packages.outputs.artifact-id, steps.packages.outputs.artifact-digest)) }}
          show-summary: false
      - name: Bound retained diagnostics
        id: evidence
        if: always()
        run: |
          directory="$RUNNER_TEMP/paseo-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/evidence"
          test -d "$directory"
          test "$(du -sb "$directory" | cut -f1)" -le 26214400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: linux-products-${{ inputs.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paseo-products-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          retention-days: 3
          if-no-files-found: error
