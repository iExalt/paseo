name: Linux product formats

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.native.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.native.outputs.artifact_digest }}
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture for installed product upgrades
        type: choice
        required: true
        default: x64
        options: [x64, arm64]
      verify_cache_transfer:
        description: Add one fresh-runner predecessor restore proof
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ inputs.source_sha && format('candidate-products-{0}-{1}', 'linux', inputs.architecture) || 'paseo-predecessor-cache-writer' }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && (github.actor == 'iExalt' || (inputs.source_sha != '' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'))
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
      artifact_digest: ${{ steps.packages.outputs.artifact-digest }}
      predecessor_key: ${{ steps.predecessor.outputs.key }}
      cache_saved: ${{ steps.predecessor-save.outcome == 'success' }}
    env:
      PASEO_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      CI: "true"
      LEFTHOOK: "0"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        if: inputs.source_sha != ''
        id: candidate
        env:
          CANDIDATE_EXPECTED_JOB: linux-products (${{ inputs.architecture }}) / native
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the immutable predecessor recipe
        id: predecessor
        run: node .github/scripts/linux-predecessor-cache.mjs prepare
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: predecessor-cache
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ steps.predecessor.outputs.key }}
      - name: Build each exact source once and fan out native formats
        timeout-minutes: 30
        env:
          PREDECESSOR_CACHE_HIT: ${{ steps.predecessor-cache.outputs.cache-hit }}
          PREDECESSOR_CACHE_MATCHED_KEY: ${{ steps.predecessor-cache.outputs.cache-matched-key }}
        run: bash .github/scripts/linux-product-build.sh
      - name: Reserve headroom before saving the predecessor
        if: inputs.source_sha == '' && steps.predecessor-cache.outputs.cache-hit != 'true'
        id: cache-budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/linux-predecessor-cache.mjs budget
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: predecessor-save
        if: steps.cache-budget.outputs.save == 'true'
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ steps.predecessor.outputs.key }}
      - name: Verify installed product upgrades and preserved state
        timeout-minutes: 10
        run: bash .github/scripts/linux-product-runtime.sh
      - name: Clean owned installations, containers and state
        if: always()
        timeout-minutes: 2
        run: bash .github/scripts/linux-product-cleanup.sh
      - name: Export verified candidate packages
        if: success() && inputs.source_sha != ''
        id: export
        env:
          CANDIDATE_CONTEXT: ${{ steps.candidate.outputs.context }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
        run: node .github/scripts/candidate-product-export.mjs linux
      - name: Transfer immutable candidate packages
        if: success() && inputs.source_sha != ''
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-linux-products-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.export.outputs.directory }}/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Bound retained diagnostics
        id: evidence
        if: always()
        run: |
          directory="$RUNNER_TEMP/paseo-products-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/evidence"
          test -d "$directory"
          test "$(du -sb "$directory" | cut -f1)" -le 26214400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: linux-products-${{ inputs.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paseo-products-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          retention-days: 1
          if-no-files-found: error

  cache-proof:
    needs: native
    if: always() && inputs.verify_cache_transfer && needs.native.outputs.cache_saved == 'true'
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - id: predecessor
        run: node .github/scripts/linux-predecessor-cache.mjs prepare
      - name: Require the same producer recipe
        env:
          PRODUCER_KEY: ${{ needs.native.outputs.predecessor_key }}
          EXPECTED_KEY: ${{ steps.predecessor.outputs.key }}
        run: test "$PRODUCER_KEY" = "$EXPECTED_KEY"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: restored
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ needs.native.outputs.predecessor_key }}
          fail-on-cache-miss: true
      - name: Validate and consume the actual restored archives
        env:
          PREDECESSOR_CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
          PREDECESSOR_CACHE_MATCHED_KEY: ${{ steps.restored.outputs.cache-matched-key }}
        run: |
          test "$PREDECESSOR_CACHE_HIT" = true
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          root="$RUNNER_TEMP/paseo-cache-proof"
          test ! -e "$root"
          mkdir -p "$root/packages" "$root/evidence"
          node .github/scripts/linux-predecessor-cache.mjs restore "$root"
          cat "$root/evidence/predecessor-cache.json"
