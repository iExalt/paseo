name: Bounded npm cache comparison

on:
  push:
    branches: [ci/github-workflows]
    paths: [.github/workflows/cache-performance-probe.yml]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.actor == 'iExalt' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 63315404a204d34f8afc71f66d401b4341276841
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: cache
        with:
          path: ${{ runner.temp }}/npm-cache/_cacache
          key: routine-npm-v1-linux-x64-v26.11.0-11.20.0-55b5bdf97ee095bcde524b89be43739fbdb9812be6c98bd773c85dbcdc05bc8a
      - name: Require the measured cache and record tools
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          node --version
          npm --version
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          lscpu | grep -E '^CPU\(s\):|^Model name:'
      - name: Compare isolated cold warm warm cold installs
        run: |
          for cache_case in cold-1 warm-1 warm-2 cold-2; do
            export npm_config_cache="$RUNNER_TEMP/cache-probe-$cache_case"
            export XDG_CACHE_HOME="$RUNNER_TEMP/extra-cache-$cache_case"
            export ELECTRON_CACHE="$XDG_CACHE_HOME/electron"
            mkdir -p "$npm_config_cache" "$XDG_CACHE_HOME"
            if [[ "$cache_case" == warm-* ]]; then
              echo "Preparing immutable cache copy for $cache_case (excluded from install timing)"
              time cp -a "$RUNNER_TEMP/npm-cache/." "$npm_config_cache/"
            fi
            echo "Measuring $cache_case at $(git rev-parse HEAD)"
            time npm ci --prefer-offline
            rm -rf "$npm_config_cache" "$XDG_CACHE_HOME"
          done
