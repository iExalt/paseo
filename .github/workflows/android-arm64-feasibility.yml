name: Android ARM64 runtime (bounded Phase A probe)

on:
  push:
    branches: [ci/github-workflows]
    paths:
      - .github/workflows/android-arm64-feasibility.yml
      - .github/scripts/probe-android-arm64.sh
      - .github/scripts/verify-probe-apk.mjs

permissions:
  contents: read

concurrency:
  group: android-arm64-feasibility
  cancel-in-progress: false

jobs:
  runtime:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.actor == 'iExalt' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          architecture: arm64
          package-manager-cache: false
      - name: Exercise signed ARM64 APK on disposable Android container
        run: bash .github/scripts/probe-android-arm64.sh
      - name: Remove owned container after interruption
        if: always()
        run: docker rm -f paseo-arm64-probe || true
      - name: Record proof boundary
        if: always()
        run: echo 'One existing signed APK runtime feasibility trial; no candidate proof, hardware/GPU proof, signing, cache writes or artifact uploads.' >> "$GITHUB_STEP_SUMMARY"
