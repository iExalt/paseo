name: Upstream Sync

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref or SHA to mirror (must be on upstream main)
        required: false
        type: string

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'iExalt/paseo' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # GITHUB_TOKEN cannot move a ref onto commits that change workflow files.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.PASEO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASEO_SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Fast-forward upstream mirror
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPSTREAM_REF: ${{ inputs.ref }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            try {
              const owner = 'iExalt';
              const repo = 'paseo';
              const destination = 'upstream/main';

              const { data: destinationBranch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: destination,
              });
              const { data: sourceBranch } = await github.rest.repos.getBranch({
                owner: 'getpaseo',
                repo: 'paseo',
                branch: 'main',
              });

              const destinationSha = destinationBranch.commit.sha;
              const mainSha = sourceBranch.commit.sha;
              const requestedRef = process.env.UPSTREAM_REF?.trim();
              const sourceSha = requestedRef
                ? (await github.rest.repos.getCommit({
                    owner: 'getpaseo', repo, ref: requestedRef,
                  })).data.sha
                : mainSha;
              if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
                throw new Error('Upstream commit did not resolve to a full SHA');
              }
              if (requestedRef) {
                const { data: membership } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: 'getpaseo', repo, basehead: `${sourceSha}...${mainSha}`,
                });
                if (!['ahead', 'identical'].includes(membership.status)) {
                  throw new Error(`Requested upstream commit is not on main: ${membership.status}`);
                }
              }

              if (destinationSha === sourceSha) {
                core.info(`upstream/main already matches getpaseo/paseo:main at ${sourceSha}`);
                return;
              }

              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `iExalt:${destinationSha}...getpaseo:${sourceSha}`,
              });

              if (comparison.status !== 'ahead') {
                throw new Error(
                  `Refusing to update upstream/main: source comparison status is ${comparison.status}`,
                );
              }

              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'heads/upstream/main',
                sha: sourceSha,
                force: false,
              });
              core.info(`Fast-forwarded upstream/main from ${destinationSha} to ${sourceSha}`);
            } catch (error) {
              core.setFailed(error.message);
            }
