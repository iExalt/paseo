name: Candidate native runtime

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
      candidate_pin:
        type: string
        required: true
      platform:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      platform:
        description: Native lane to verify; select one only when the other already has accepted evidence.
        required: true
        type: choice
        default: both
        options: [both, android, macos]
      candidate_pin:
        description: "JSON with runId, attempt, sourceSha, version, artifactId and artifactDigest from the accepted paired producer."
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PASEO_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
  CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
  CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
  PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
  PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
  PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
  PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}

concurrency:
  group: candidate-native-runtime
  cancel-in-progress: false

jobs:
  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: runtime

  android:
    needs: [authorize]
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || inputs.source_sha == '') && (github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && (github.actor == 'iExalt' || (inputs.source_sha != '' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev')) && (inputs.platform == 'both' || inputs.platform == 'android')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: runtime
      CANDIDATE_EXPECTED_JOB: native-runtime / android
      CANDIDATE_PIN: ${{ inputs.candidate_pin }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CI: "true"
      LEFTHOOK: "0"
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Begin evidence for Authenticate candidate and admitted attempt
        id: proof_start_34
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Authenticate candidate and admitted attempt
          number: "34"
      - name: Authenticate candidate and admitted attempt
        id: proof_target_34
        if: inputs.source_sha != ''
        env:
          CANDIDATE_EXPECTED_JOB: native-runtime / android
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Record evidence for Authenticate candidate and admitted attempt
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Authenticate candidate and admitted attempt
          number: "34"
          started: ${{ steps.proof_start_34.outputs.started }}
          outcome: ${{ steps.proof_target_34.outcome }}
          conclusion: ${{ steps.proof_target_34.conclusion }}

      - name: Begin evidence for Verify signed ARM64 APKs and retained native state
        id: proof_start_35
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Verify signed ARM64 APKs and retained native state
          number: "35"
      - name: Verify signed ARM64 APKs and retained native state
        id: proof_target_35
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/android-candidate-host.sh
      - name: Record evidence for Verify signed ARM64 APKs and retained native state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Verify signed ARM64 APKs and retained native state
          number: "35"
          started: ${{ steps.proof_start_35.outputs.started }}
          outcome: ${{ steps.proof_target_35.outcome }}
          conclusion: ${{ steps.proof_target_35.conclusion }}

      - name: Begin evidence for Remove owned Android container after interruption
        id: proof_start_36
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Remove owned Android container after interruption
          number: "36"
      - name: Remove owned Android container after interruption
        id: proof_target_36
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/paseo-native-candidate-owned" && docker inspect paseo-native-candidate >/dev/null 2>&1; then
            docker rm -f paseo-native-candidate
          fi
      - name: Record evidence for Remove owned Android container after interruption
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Remove owned Android container after interruption
          number: "36"
          started: ${{ steps.proof_start_36.outputs.started }}
          outcome: ${{ steps.proof_target_36.outcome }}
          conclusion: ${{ steps.proof_target_36.conclusion }}

      - name: Bound retained Android evidence
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          directory=.dev/github-workflows/native/android
          test -d "$directory"
          bytes="$(du -sb "$directory" | cut -f1)"
          test "$bytes" -le 26214400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        with:
          name: native-android-${{ github.sha }}-${{ github.run_attempt }}
          path: .dev/github-workflows/native/android/
          retention-days: 1
          if-no-files-found: error
  macos:
    needs: [authorize]
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || inputs.source_sha == '') && (github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && (github.actor == 'iExalt' || (inputs.source_sha != '' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev')) && (inputs.platform == 'both' || inputs.platform == 'macos')) }}
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: runtime
      CANDIDATE_EXPECTED_JOB: native-runtime / macos
      CANDIDATE_PIN: ${{ inputs.candidate_pin }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CI: "true"
      LEFTHOOK: "0"
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Begin evidence for Authenticate candidate and admitted attempt
        id: proof_start_37
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Authenticate candidate and admitted attempt
          number: "37"
      - name: Authenticate candidate and admitted attempt
        id: proof_target_37
        if: inputs.source_sha != ''
        env:
          CANDIDATE_EXPECTED_JOB: native-runtime / macos
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Record evidence for Authenticate candidate and admitted attempt
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Authenticate candidate and admitted attempt
          number: "37"
          started: ${{ steps.proof_start_37.outputs.started }}
          outcome: ${{ steps.proof_target_37.outcome }}
          conclusion: ${{ steps.proof_target_37.conclusion }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install locked harness dependencies
        run: |
          test "$(node --version)" = v26.11.0
          test "$(npm --version)" = 11.20.0
          npm ci --cache "$RUNNER_TEMP/npm-cache"
          npm run build:server
      - name: Begin evidence for Verify canonical signed packages and preserved native state
        id: proof_start_38
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Verify canonical signed packages and preserved native state
          number: "38"
      - name: Verify canonical signed packages and preserved native state
        id: proof_target_38
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/macos-candidate-runtime.mjs
      - name: Record evidence for Verify canonical signed packages and preserved native state
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Verify canonical signed packages and preserved native state
          number: "38"
          started: ${{ steps.proof_start_38.outputs.started }}
          outcome: ${{ steps.proof_target_38.outcome }}
          conclusion: ${{ steps.proof_target_38.conclusion }}

      - name: Bound retained evidence
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          directory=.dev/github-workflows/native/macos
          test -d "$directory"
          bytes="$(find "$directory" -type f -exec stat -f%z {} \; | awk '{sum += $1} END {print sum+0}')"
          test "$bytes" -le 26214400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        with:
          name: native-macos-${{ github.sha }}-${{ github.run_attempt }}
          path: .dev/github-workflows/native/macos/
          retention-days: 1
          if-no-files-found: error
