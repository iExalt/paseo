name: Exact candidate verification

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: verification

  verify:
    needs: [authorize]
    name: ${{ matrix.kind }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.kind == 'routine' && 5 || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { kind: routine, lane: quality }
          - { kind: routine, lane: workspaces }
          - { kind: routine, lane: app }
          - { kind: routine, lane: server-1 }
          - { kind: routine, lane: server-2 }
          - { kind: routine, lane: server-3 }
          - { kind: routine, lane: integration }
          - { kind: deep, lane: browser }
          - { kind: deep, lane: integration }
          - { kind: deep, lane: electron }
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: verification
      CANDIDATE_EXPECTED_JOB: verify / ${{ matrix.kind }} (${{ matrix.lane }})
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      npm_config_audit: "false"
      npm_config_fund: "false"
      PASEO_CANDIDATE_SHA: ${{ inputs.source_sha }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      attestations: read
    steps:
      - name: Read trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
        with:
          actionlint: ${{ matrix.kind == 'routine' }}
      - name: Authenticate candidate and admitted attempt
        id: candidate
        env:
          CANDIDATE_EXPECTED_JOB: verify / ${{ matrix.kind }} (${{ matrix.lane }})
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out candidate identity
        env:
          EXPECTED_TREE: ${{ steps.candidate.outputs.tree_sha }}
          FORK_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$PASEO_CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          node .github/scripts/candidate-identity.mjs "$PASEO_CANDIDATE_SHA" "$FORK_VERSION"
      - name: Install locked dependencies once
        env:
          npm_config_fetch_timeout: "30000"
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
        run: |
          test "$(node --version)" = v26.11.0
          test "$(npm --version)" = 11.20.0
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
          npm ci --cache "$RUNNER_TEMP/npm-cache"
      - name: Verify complete routine lane
        if: matrix.kind == 'routine'
        env:
          ROUTINE_LANE: ${{ matrix.lane }}
        # Unit fixtures must not select live coordinator transport from ambient CI identity.
        run: env -u GITHUB_WORKFLOW_REF mise run --skip-tools ci:routine --lane "$ROUTINE_LANE"
      - name: Exercise isolated deep journey
        if: matrix.kind == 'deep'
        env:
          DEEP_LANE: ${{ matrix.lane }}
        run: node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$PASEO_CANDIDATE_SHA"
      - name: Bound retained deep diagnostics
        id: diagnostics
        if: ${{ !cancelled() && matrix.kind == 'deep' && matrix.lane != 'integration' }}
        env:
          DEEP_LANE: ${{ matrix.lane }}
        run: |
          directory=".dev/github-workflows/deep/$DEEP_LANE"
          test -d "$directory"
          test "$(du -sb "$directory" | cut -f1)" -le 26214400
      - name: Retain candidate screenshots and traces
        if: ${{ !cancelled() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-deep-${{ matrix.lane }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: .dev/github-workflows/deep/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 1
