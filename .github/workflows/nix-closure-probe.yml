name: Nix closure probe

on:
  push:
    branches: [dev]
    paths:
      - ".github/scripts/nix-closure-probe.sh"
      - ".github/workflows/nix-closure-probe.yml"

permissions:
  contents: read

concurrency:
  group: nix-closure-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-export:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.probe.outputs.source_sha }}
      source_rev_count: ${{ steps.probe.outputs.source_rev_count }}
      lock_hash: ${{ steps.probe.outputs.lock_hash }}
      output_path: ${{ steps.probe.outputs.output_path }}
      manifest_path: ${{ steps.probe.outputs.manifest_path }}
      release_tag: ${{ steps.probe.outputs.release_tag }}
      asset_name: ${{ steps.probe.outputs.asset_name }}
      archive_bytes: ${{ steps.probe.outputs.archive_bytes }}
      cache_bytes: ${{ steps.probe.outputs.cache_bytes }}
      cache_file_count: ${{ steps.probe.outputs.cache_file_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and export signed closure
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_PROBE_SIGNING_KEY: ${{ secrets.PASEO_NIX_PROBE_SIGNING_KEY }}
          NIX_PROBE_PUBLIC_KEY: paseo-nix-full-probe-20261009-170943:tTPBgyqhZEb87G3TgRrr/K8w8uAWRLd6oHblZcgJFXo=
        run: bash .github/scripts/nix-closure-probe.sh build-and-export

  verify-import:
    needs: build-and-export
    runs-on: macos-14
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Import and verify on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_REV_COUNT: ${{ needs.build-and-export.outputs.source_rev_count }}
          EXPECTED_LOCK_HASH: ${{ needs.build-and-export.outputs.lock_hash }}
          EXPECTED_OUTPUT_PATH: ${{ needs.build-and-export.outputs.output_path }}
          EXPECTED_MANIFEST_PATH: ${{ needs.build-and-export.outputs.manifest_path }}
          PROBE_RELEASE_TAG: ${{ needs.build-and-export.outputs.release_tag }}
          PROBE_ASSET_NAME: ${{ needs.build-and-export.outputs.asset_name }}
          EXPECTED_ARCHIVE_BYTES: ${{ needs.build-and-export.outputs.archive_bytes }}
          EXPECTED_CACHE_BYTES: ${{ needs.build-and-export.outputs.cache_bytes }}
          EXPECTED_CACHE_FILE_COUNT: ${{ needs.build-and-export.outputs.cache_file_count }}
          NIX_PROBE_PUBLIC_KEY: paseo-nix-full-probe-20261009-170943:tTPBgyqhZEb87G3TgRrr/K8w8uAWRLd6oHblZcgJFXo=
        run: bash .github/scripts/nix-closure-probe.sh verify-import
