name: Authenticate candidate workers

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
      group:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.authenticate.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.authenticate.outputs.artifact_digest }}

permissions: {}

jobs:
  authenticate:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Read trusted controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Authenticate current worker phase
        id: authenticate
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_CANDIDATE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          CANDIDATE_GRANT_GROUP: ${{ inputs.group }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-grant.mjs
      - name: Upload authenticated worker grant
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-grant-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grant.json
          if-no-files-found: error
          retention-days: 1
      - name: Bind step proof to this run attempt
        id: proof-subject
        if: steps.authenticate.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          PROOF_SLOT: grant-${{ inputs.group }}
        shell: bash
        run: |
          [[ "$PROOF_SLOT" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]
          subject="$RUNNER_TEMP/paseo-step-proof-$PROOF_SLOT"
          printf 'paseo-step-proof-v1\n%s\n%s\n%s\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROOF_SLOT" > "$subject"
          { echo "subject=$subject"; echo "slot=$PROOF_SLOT"; } >> "$GITHUB_OUTPUT"
      - name: Sign step proof
        if: steps.proof-subject.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.proof-subject.outputs.subject }}
          predicate-type: https://github.com/iExalt/paseo/attestations/step-proof/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-step-proof","repository":"{0}","runId":{1},"attempt":{2},"slot":"{3}","evidence":{4}}}', github.repository, github.run_id, github.run_attempt, steps.proof-subject.outputs.slot, format('{{"artifactId":{0},"artifactDigest":"{1}"}}', steps.upload.outputs.artifact-id, steps.upload.outputs.artifact-digest)) }}
          show-summary: false
