name: Authenticate candidate workers

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
      group:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.authenticate.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.authenticate.outputs.artifact_digest }}

permissions: {}

jobs:
  authenticate:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Read trusted controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Authenticate current worker phase
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_CANDIDATE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          CANDIDATE_GRANT_GROUP: ${{ inputs.group }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-grant.mjs
      - name: Begin evidence for Upload authenticated worker grant
        id: proof_start_1
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Upload authenticated worker grant
          number: "1"
      - name: Upload authenticated worker grant
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-grant-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grant.json
          if-no-files-found: error
          retention-days: 1
      - name: Record evidence for Upload authenticated worker grant
        if: ${{ !cancelled() }}
        uses: ./.github/actions/record-step
        with:
          name: Upload authenticated worker grant
          number: "1"
          started: ${{ steps.proof_start_1.outputs.started }}
          outcome: ${{ steps.upload.outcome }}
          conclusion: ${{ steps.upload.conclusion }}
