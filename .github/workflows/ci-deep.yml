    branches: [dev]
  workflow_dispatch:
    if: >-
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
       (github.event_name == 'workflow_dispatch' && github.actor == 'iExalt' &&
    permissions:
      contents: read
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          test "$(node --version)" = v26.13.0
