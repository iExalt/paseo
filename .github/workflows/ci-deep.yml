name: Deep verification

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      source_sha:
        description: Full candidate SHA, matching the caller commit.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authorize-release:
    if: >-
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'iExalt/paseo' &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Revalidate bot PR identity and capture current head
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/release-pr.mjs
  browser:
    name: deep (${{ matrix.lane }})
    needs: authorize-release
    if: >-
      !cancelled() &&
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
      (needs.authorize-release.outputs.allowed == 'true' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'iExalt/paseo' &&
        github.event.pull_request.head.repo.owner.login == 'iExalt' &&
        github.event.pull_request.head.ref == 'ci/github-workflows' &&
        contains(github.event.pull_request.labels.*.name, 'ci:deep')) ||
       (inputs.source_sha == github.sha && github.actor == 'iExalt' &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ci/github-workflows')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [browser, integration, electron]
    env:
      CI: "true"
      LEFTHOOK: "0"
      npm_config_audit: "false"
      npm_config_fund: "false"
      SOURCE_SHA: ${{ needs.authorize-release.outputs.sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.source_sha) }}
      DEEP_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Validate exact source and isolated configuration
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$SOURCE_SHA" --plan
          node .github/scripts/ci-source-receipt.mjs
      - name: Install locked dependencies
        run: |
          test "$(node --version)" = v26.11.0
          test "$(npm --version)" = 11.20.0
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
          time npm ci --cache "$RUNNER_TEMP/npm-cache"
      - name: Exercise isolated deep contracts
        run: node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$SOURCE_SHA"
      - name: Bound retained diagnostics
        id: diagnostics
        if: ${{ !cancelled() && matrix.lane != 'integration' }}
        run: |
          directory=".dev/github-workflows/deep/$DEEP_LANE"
          test -d "$directory"
          bytes="$(du -sb "$directory" | cut -f1)"
          test "$bytes" -le 26214400
      - name: Retain screenshot and trace for review
        if: ${{ !cancelled() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-${{ matrix.lane }}-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: .dev/github-workflows/deep/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 1
