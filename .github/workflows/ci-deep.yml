name: Deep verification

on:
  # Every PR reports the required gate; only release PRs run the deep lanes.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: deep (${{ matrix.lane }})
    # Release PR branches live in this repository, so only collaborators can push them.
    if: >-
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
      ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == 'iExalt/paseo' &&
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'iExalt' &&
        github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [browser, integration, electron]
    permissions:
      contents: read
    env:
      CI: "true"
      LEFTHOOK: "0"
      npm_config_audit: "false"
      npm_config_fund: "false"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEEP_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SOURCE_SHA != github.sha
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Validate exact source and isolated configuration
        run: node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$SOURCE_SHA" --plan
      - name: Configure pinned npm installation
        run: |
          test "$(node --version)" = v26.13.1
          test "npm@$(npm --version)" = "$(node -p 'require("./package.json").packageManager')"
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"
      # Reuse dev's read-only installed-dependency cache (written only by ci.yml on dev pushes).
      - name: Bind installed dependency cache key
        id: modules
        run: |
          key="$(NPM_VERSION="$(npm --version)" node .github/scripts/dependency-fingerprint.mjs routine-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore installed dependencies from dev
        id: restore-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          key: ${{ steps.modules.outputs.key }}
          path: |
            node_modules
            packages/*/node_modules
      - name: Install locked dependencies
        if: steps.restore-modules.outputs.cache-hit != 'true'
        env:
          npm_config_fetch_timeout: "30000"
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
        run: time npm ci --cache "$RUNNER_TEMP/npm-cache"
      # Deep caches are restored read-only on all deep runs and written only on trusted
      # dev workflow_dispatch runs so PR code can never poison dev-scoped caches.
      - name: Bind deep cache keys
        id: deep-caches
        if: matrix.lane == 'browser' || matrix.lane == 'electron'
        run: NPM_VERSION="$(npm --version)" node .github/scripts/ci-deep.mjs --cache-keys >> "$GITHUB_OUTPUT"
      - name: Restore Playwright Chromium cache
        id: restore-playwright
        if: matrix.lane == 'browser'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          key: ${{ steps.deep-caches.outputs.playwright_key }}
          path: ${{ steps.deep-caches.outputs.playwright_path }}
      - name: Restore Metro transform cache
        id: restore-metro
        if: matrix.lane == 'browser' || matrix.lane == 'electron'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          key: ${{ steps.deep-caches.outputs.metro_key }}
          restore-keys: ${{ !(github.event_name == 'workflow_dispatch' && matrix.lane == 'browser') && steps.deep-caches.outputs.metro_prefix || '' }}
          path: ${{ steps.deep-caches.outputs.metro_path }}
      - name: Exercise isolated deep contracts
        run: node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$SOURCE_SHA"
      - name: Save Playwright Chromium cache
        if: >-
          matrix.lane == 'browser' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/dev' &&
          steps.restore-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          key: ${{ steps.deep-caches.outputs.playwright_key }}
          path: ${{ steps.deep-caches.outputs.playwright_path }}
      - name: Save Metro transform cache
        if: >-
          matrix.lane == 'browser' &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/dev' &&
          steps.restore-metro.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        with:
          key: ${{ steps.deep-caches.outputs.metro_key }}
          path: ${{ steps.deep-caches.outputs.metro_path }}
      - name: Bound retained diagnostics
        id: diagnostics
        if: ${{ !cancelled() && matrix.lane != 'integration' }}
        run: |
          directory=".dev/github-workflows/deep/$DEEP_LANE"
          test -d "$directory"
          bytes="$(du -sb "$directory" | cut -f1)"
          test "$bytes" -le 26214400
      - name: Retain screenshot and trace for review
        if: ${{ !cancelled() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-${{ matrix.lane }}-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: .dev/github-workflows/deep/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 1

  required:
    name: Deep verification required
    if: always()
    needs: browser
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require release deep success
        env:
          DEEP_REQUIRED: ${{ github.event_name != 'pull_request' || startsWith(github.event.pull_request.head.ref, 'release-please--branches--') }}
          RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$DEEP_REQUIRED" == true ]]; then
            test "$RESULT" = success
          else
            test "$RESULT" = skipped
          fi
