name: Deep verification

on:
  # Only release PRs need deep proof; each bumps the fork release version.
  # release-please labels each new PR right after opening, so the labeled event
  # replaces a separate opened run.
  pull_request:
    types: [synchronize, reopened, labeled]
    branches: [dev]
    paths: [.github/fork-release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authorize-release:
    if: >-
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
      github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
      (github.event.action != 'labeled' || github.event.label.name == 'autorelease: pending') &&
      github.event.pull_request.head.repo.full_name == 'iExalt/paseo' &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Revalidate bot PR identity and capture current head
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/release-pr.mjs
  browser:
    name: deep (${{ matrix.lane }})
    needs: authorize-release
    if: >-
      !cancelled() &&
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
      (needs.authorize-release.outputs.allowed == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'iExalt' &&
        (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ci/github-workflows')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [browser, integration, electron]
    permissions:
      contents: read
    env:
      CI: "true"
      LEFTHOOK: "0"
      npm_config_audit: "false"
      npm_config_fund: "false"
      SOURCE_SHA: ${{ needs.authorize-release.outputs.sha || (github.event_name == 'workflow_dispatch' && github.sha) }}
      DEEP_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Validate exact source and isolated configuration
        run: node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$SOURCE_SHA" --plan
      - name: Install locked dependencies
        env:
          npm_config_fetch_timeout: "30000"
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
        run: |
          test "$(node --version)" = v26.11.1
          test "$(npm --version)" = 11.20.0
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
          time npm ci --cache "$RUNNER_TEMP/npm-cache"
      - name: Exercise isolated deep contracts
        run: node .github/scripts/ci-deep.mjs "$DEEP_LANE" "$SOURCE_SHA"
      - name: Bound retained diagnostics
        id: diagnostics
        if: ${{ !cancelled() && matrix.lane != 'integration' }}
        run: |
          directory=".dev/github-workflows/deep/$DEEP_LANE"
          test -d "$directory"
          bytes="$(du -sb "$directory" | cut -f1)"
          test "$bytes" -le 26214400
      - name: Retain screenshot and trace for review
        if: ${{ !cancelled() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-${{ matrix.lane }}-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: .dev/github-workflows/deep/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 1
