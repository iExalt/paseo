name: Android ccache writer

# Dispatch on dev after a native dependency change to prewarm the fork APK's
# attested ccache. Candidates restore the newest entry under the key prefix.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paseo-build-cache-writer-android
  cancel-in-progress: false

jobs:
  probe:
    name: Rehearse an existing Android ccache
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    outputs:
      key: ${{ steps.ccache.outputs.key }}
      hit: ${{ steps.ccache-cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          package-manager-cache: false
      - name: Install ccache
        timeout-minutes: 3
        run: command -v ccache >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }
      - name: Bind Android ccache recipe
        id: ccache
        run: node .github/scripts/android-build-cache.mjs key
      - name: Restore the exact Android ccache entry
        id: ccache-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 3
        with:
          path: ${{ steps.ccache.outputs.archive }}
          key: ${{ steps.ccache.outputs.key }}
      # A writer that finds its key rehearses the candidate's verification instead.
      - name: Verify the existing Android ccache
        if: steps.ccache-cache.outputs.cache-hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_CACHE_KEY: ${{ steps.ccache.outputs.key }}
        run: node .github/scripts/android-build-cache.mjs self-verify

  write:
    name: Write attested Android ccache
    needs: [probe]
    if: needs.probe.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"
      - name: Install ccache
        timeout-minutes: 3
        run: command -v ccache >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }
      - name: Bind Android ccache recipe
        id: ccache
        env:
          PROBED_KEY: ${{ needs.probe.outputs.key }}
        run: |
          set -euo pipefail
          node .github/scripts/android-build-cache.mjs key
          test "$(sed -n 's/^key=//p' "$GITHUB_OUTPUT")" = "$PROBED_KEY"
      # Generated WebView output changes a tracked file; bind clean source first.
      - name: Resolve Android version code from the clean checkout
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          version="$(node -p 'require("./package.json").version')"
          code="$(node .github/scripts/candidate-identity.mjs "$GITHUB_SHA" "$version" | sed -n 's/^version_code=//p')"
          test -n "$code"
          echo "PASEO_ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build:app-deps
      - run: npm --prefix packages/app run build:terminal-webview
      # Firebase config reaches only Android resources, never native objects.
      - name: Write placeholder Firebase client config
        run: |
          set -euo pipefail
          firebase_file="$RUNNER_TEMP/placeholder-google-services.json"
          cat > "$firebase_file" <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "paseo-18157", "storage_bucket": "paseo-18157.appspot.com" },
            "client": [
              {
                "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "sh.paseo.iexalt" } },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyD000000000000000000000000000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          {
            echo "APP_VARIANT=fork"
            echo "GOOGLE_SERVICES_FILE_FORK=$firebase_file"
            echo "FIREBASE_PROJECT_ID_FORK=paseo-18157"
          } >> "$GITHUB_ENV"
      - name: Generate fork Android project
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install --non-interactive
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25.0.4"
      - name: Resolve Gradle cache home
        id: gradle-cache-home
        run: echo "home=$HOME" >> "$GITHUB_OUTPUT"
      - name: Restore exact Gradle dependencies without saving
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 3
        with:
          key: setup-java-Linux-x64-gradle-${{ hashFiles('packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          path: |
            ${{ steps.gradle-cache-home.outputs.home }}/.gradle/caches
            ${{ steps.gradle-cache-home.outputs.home }}/.gradle/wrapper
      - name: Install pinned Android SDK packages and provision runner swap
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          bash "$GITHUB_WORKSPACE/scripts/runner-swap.sh" enable
      - name: Compile native code through ccache
        env:
          CCACHE_PATH_DIR: ${{ steps.ccache.outputs.ccache_dir }}
        run: |
          {
            echo "CCACHE_DIR=$CCACHE_PATH_DIR"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=3G"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
      - name: Assemble arm64 release
        run: |
          set -euo pipefail
          cd packages/app/android
          env JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED ./gradlew :app:assembleRelease \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PreactNativeArchitectures=arm64-v8a
          ccache --show-stats
      - name: Disable and remove task-owned Android swap
        if: always()
        timeout-minutes: 3
        run: bash "$GITHUB_WORKSPACE/scripts/runner-swap.sh" cleanup
      - name: Archive the Android ccache
        id: ccache-archive
        run: node .github/scripts/android-build-cache.mjs archive
      - name: Attest the Android ccache archive
        if: steps.ccache-archive.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.ccache.outputs.archive }}
          predicate-type: https://github.com/iExalt/paseo/attestations/build-cache/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-build-cache","key":"{0}"}}', steps.ccache.outputs.key) }}
          show-summary: false
      - name: Verify the writer's own attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_CACHE_KEY: ${{ steps.ccache.outputs.key }}
        run: node .github/scripts/android-build-cache.mjs self-verify
      - name: Check Android ccache headroom
        id: ccache-budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/android-build-cache.mjs budget
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.ccache-budget.outputs.save == 'true'
        timeout-minutes: 5
        with:
          path: ${{ steps.ccache.outputs.archive }}
          key: ${{ steps.ccache.outputs.key }}
