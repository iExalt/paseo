name: Fork Android APK

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
      source_sha:
        description: Immutable commit SHA shared by the paired build lanes.
        required: true
        type: string
      fork_version:
        description: Canonical source semver shared by both lanes.
        required: true
        type: string
    secrets:
      PASEO_FORK_GOOGLE_SERVICES_JSON:
        required: true
      PASEO_FORK_SIGNING_KEY_PKCS8_PEM:
        required: true
      PASEO_FORK_SIGNING_CERT_PEM:
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.sign.outputs.source_sha }}
      fork_version:
        value: ${{ jobs.sign.outputs.fork_version }}
      version_code:
        value: ${{ jobs.sign.outputs.version_code }}
      package_id:
        value: ${{ jobs.sign.outputs.package_id }}
      signing_certificate_sha256:
        value: ${{ jobs.sign.outputs.signing_certificate_sha256 }}
      apk_sha256:
        value: ${{ jobs.sign.outputs.apk_sha256 }}
      metadata_sha256:
        value: ${{ jobs.sign.outputs.metadata_sha256 }}
      artifact_name:
        value: ${{ jobs.sign.outputs.artifact_name }}
      artifact_id:
        value: ${{ jobs.sign.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.sign.outputs.artifact_digest }}
      verified:
        value: ${{ jobs.sign.outputs.verified }}

env:
  PASEO_CANDIDATE_SHA: ${{ inputs.source_sha }}

concurrency:
  group: fork-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  authorize-sign:
    needs: [build]
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: android-sign

  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: android-build

  build:
    needs: [authorize]
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'
    name: Build fork arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_id: ${{ steps.upload-candidate.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
      version_code: ${{ steps.version.outputs.version_code }}
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: android-build
      CANDIDATE_EXPECTED_JOB: paired / Build and sign Android APK / Build fork arm64 APK
    steps:
      - name: Read trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        id: authority
        env:
          CANDIDATE_EXPECTED_JOB: paired / Build and sign Android APK / Build fork arm64 APK
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean immutable dev commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "iExalt/paseo"
          test "$GITHUB_REF" = "refs/heads/dev"
          node .github/scripts/native-candidate-authority.mjs
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$PASEO_CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Check runner disk budget
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          minimum_kb=$((8 * 1024 * 1024))
          if (( available_kb < minimum_kb )); then
            echo "Fork APK build needs at least 8 GiB free on the runner." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@boudra"

      - name: Resolve fork Android version code
        id: version
        shell: bash
        env:
          FORK_VERSION: ${{ inputs.fork_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          identity="$(node .github/scripts/candidate-identity.mjs "$SOURCE_SHA" "$FORK_VERSION")"
          version_code="$(printf '%s\n' "$identity" | sed -n 's/^version_code=//p')"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "PASEO_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Build terminal WebView assets
        run: npm --prefix packages/app run build:terminal-webview

      - name: Prepare protected Firebase client config
        shell: bash
        env:
          PASEO_FORK_GOOGLE_SERVICES_JSON: ${{ secrets.PASEO_FORK_GOOGLE_SERVICES_JSON }}
          FIREBASE_PROJECT_ID_FORK: paseo-18157
        run: |
          set -euo pipefail
          umask 077
          test -n "$PASEO_FORK_GOOGLE_SERVICES_JSON"
          firebase_file="$RUNNER_TEMP/paseo-fork-google-services.json"
          printf '%s' "$PASEO_FORK_GOOGLE_SERVICES_JSON" > "$firebase_file"
          chmod 600 "$firebase_file"
          project_id="$(node - "$firebase_file" "$FIREBASE_PROJECT_ID_FORK" <<'NODE'
          const fs = require("node:fs");
          const { validateForkGoogleServicesConfig } = require("./packages/app/app-variant");
          try {
            const config = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const expectedProjectId = process.argv[3];
            validateForkGoogleServicesConfig(config, expectedProjectId);
            process.stdout.write(expectedProjectId);
          } catch {
            console.error("Firebase client config failed validation.");
            process.exitCode = 1;
          }
          NODE
          )"
          {
            echo "APP_VARIANT=fork"
            echo "GOOGLE_SERVICES_FILE_FORK=$firebase_file"
            echo "FIREBASE_PROJECT_ID_FORK=$project_id"
          } >> "$GITHUB_ENV"

      - name: Generate fork Android project
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install --non-interactive

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25.0.4"

      # Match setup-java v4.7.1's absolute paths and exact key, without its save hook.
      - name: Resolve Gradle cache home
        id: gradle-cache-home
        run: echo "home=$HOME" >> "$GITHUB_OUTPUT"
      - name: Restore exact Gradle dependencies without saving
        id: gradle-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 3
        with:
          key: setup-java-Linux-x64-gradle-${{ hashFiles('packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          path: |
            ${{ steps.gradle-cache-home.outputs.home }}/.gradle/caches
            ${{ steps.gradle-cache-home.outputs.home }}/.gradle/wrapper

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not installed on this runner}}"
          sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"

      - name: Record Android build budget and provision runner swap
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --version
          "$sdkmanager" --list_installed | awk '/platform-tools|platforms;android-36|build-tools;36.0.0/ { print }'
          if [[ -d "$ANDROID_HOME/ndk" ]]; then
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort
          fi
          df -h "$ANDROID_HOME" "$RUNNER_TEMP" .
          bash "$GITHUB_WORKSPACE/scripts/runner-swap.sh" enable

      - name: Assemble arm64 release candidate
        shell: bash
        run: |
          set -euo pipefail
          wrapper="packages/app/android/gradle/wrapper/gradle-wrapper.properties"
          grep -qF 'gradle-9.3.1-bin.zip' "$wrapper"
          started_at=$SECONDS
          cd packages/app/android
          JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED ./gradlew --version
          bash "$GITHUB_WORKSPACE/scripts/gradle-resource-watch.sh" -- \
            env JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED ./gradlew :app:assembleRelease \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PreactNativeArchitectures=arm64-v8a
          echo "gradle_elapsed_seconds=$((SECONDS - started_at))"
          df -h "$ANDROID_HOME" "$RUNNER_TEMP" .

      - name: Disable and remove task-owned Android swap
        if: always()
        timeout-minutes: 3
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/runner-swap.sh" cleanup

      - name: Verify and package release candidate
        id: candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORK_VERSION: ${{ inputs.fork_version }}
        run: |
          set -euo pipefail
          candidate="packages/app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$candidate"
          test "$(stat -c%s "$candidate")" -le 536870912
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer"
          package_id="$("$apkanalyzer" manifest application-id "$candidate")"
          version_code="$("$apkanalyzer" manifest version-code "$candidate")"
          debuggable="$("$apkanalyzer" manifest debuggable "$candidate")"
          test "$package_id" = "sh.paseo.iexalt"
          test "$version_code" = "${{ steps.version.outputs.version_code }}"
          test "$("$apkanalyzer" manifest version-name "$candidate")" = "$FORK_VERSION"
          test "$debuggable" = "false"
          abis="$(unzip -Z1 "$candidate" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)"
          test "$abis" = "arm64-v8a"

          candidate_dir="$RUNNER_TEMP/fork-apk-candidate"
          mkdir -p "$candidate_dir"
          cp "$candidate" "$candidate_dir/paseo-iexalt-fork.apk"
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg forkVersion "$FORK_VERSION" \
            --arg packageId "$package_id" \
            --arg versionCode "$version_code" \
            --arg abi "$abis" \
            '{kind: "paseo-verification-candidate", schemaVersion: 2, platform: "android-arm64", sourceSha: $sourceSha, runId: $runId, runNumber: $runNumber, runAttempt: $runAttempt, forkVersion: $forkVersion, packageId: $packageId, versionCode: $versionCode, abi: $abi}' \
            > "$candidate_dir/build-metadata.json"
          artifact_name="paseo-iexalt-candidate-${version_code}-${SOURCE_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Candidate APK verified for package $package_id, code $version_code, ABI $abis."

      - name: Remove decrypted Firebase client config
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/paseo-fork-google-services.json" \
            "$GITHUB_WORKSPACE/packages/app/android/app/google-services.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-candidate
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/fork-apk-candidate/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [build, authorize-sign]
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'
    name: Sign and publish fork APK artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.signed.outputs.source_sha }}
      fork_version: ${{ steps.signed.outputs.fork_version }}
      version_code: ${{ steps.signed.outputs.version_code }}
      package_id: ${{ steps.signed.outputs.package_id }}
      signing_certificate_sha256: ${{ steps.signed.outputs.signing_certificate_sha256 }}
      apk_sha256: ${{ steps.signed.outputs.apk_sha256 }}
      metadata_sha256: ${{ steps.signed.outputs.metadata_sha256 }}
      artifact_name: ${{ steps.signed.outputs.artifact_name }}
      artifact_id: ${{ steps.upload-final.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-final.outputs.artifact-digest }}
      verified: ${{ steps.signed.outputs.verified }}
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize-sign.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize-sign.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: android-sign
      CANDIDATE_EXPECTED_JOB: paired / Build and sign Android APK / Sign and publish fork APK artifact
    steps:
      - name: Read trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        id: authority
        env:
          CANDIDATE_EXPECTED_JOB: paired / Build and sign Android APK / Sign and publish fork APK artifact
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25.0.4"

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not installed on this runner}}"
          sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"

      - name: Record signing tool versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          df -h "$ANDROID_HOME" "$RUNNER_TEMP"

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/fork-apk-candidate
          merge-multiple: true

      - name: Sign and verify with the approved fork certificate
        id: signed
        shell: bash
        env:
          PASEO_FORK_SIGNING_KEY_PKCS8_PEM: ${{ secrets.PASEO_FORK_SIGNING_KEY_PKCS8_PEM }}
          PASEO_FORK_SIGNING_CERT_PEM: ${{ secrets.PASEO_FORK_SIGNING_CERT_PEM }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORK_VERSION: ${{ inputs.fork_version }}
          APPROVED_CERT_SHA256: 943626cd89e2d0b763d432db9100110b878953356db9d3e46497be2179989459
        run: |
          set -euo pipefail
          umask 077
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$VERSION_CODE" -le 2100000000
          test -n "$PASEO_FORK_SIGNING_KEY_PKCS8_PEM"
          test -n "$PASEO_FORK_SIGNING_CERT_PEM"
          key_pem_file="$RUNNER_TEMP/fork-signing-key.pk8.pem"
          key_file="$RUNNER_TEMP/fork-signing-key.pk8.der"
          cert_file="$RUNNER_TEMP/fork-signing-cert.pem"
          printf '%s' "$PASEO_FORK_SIGNING_KEY_PKCS8_PEM" > "$key_pem_file"
          printf '%s' "$PASEO_FORK_SIGNING_CERT_PEM" > "$cert_file"
          chmod 600 "$key_pem_file" "$cert_file"
          openssl pkcs8 -topk8 -nocrypt -in "$key_pem_file" -outform DER -out "$key_file"
          chmod 600 "$key_file"
          openssl pkey -inform DER -in "$key_file" -noout
          cert_digest="$(openssl x509 -in "$cert_file" -noout -fingerprint -sha256 | sed 's/^[^=]*=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert_digest" = "$APPROVED_CERT_SHA256"
          key_public_digest="$(openssl pkey -inform DER -in "$key_file" -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"
          cert_public_digest="$(openssl x509 -in "$cert_file" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"
          test "$key_public_digest" = "$cert_public_digest"

          candidate="$RUNNER_TEMP/fork-apk-candidate/paseo-iexalt-fork.apk"
          metadata="$RUNNER_TEMP/fork-apk-candidate/build-metadata.json"
          test "$PASEO_CANDIDATE_SHA" = "$SOURCE_SHA"
          jq -e '.kind == "paseo-verification-candidate" and .schemaVersion == 2 and .platform == "android-arm64" and (has("releaseSequence") | not)' "$metadata" >/dev/null
          test "$(jq -r .sourceSha "$metadata")" = "$SOURCE_SHA"
          test "$(jq -r .forkVersion "$metadata")" = "$FORK_VERSION"
          test "$(jq -r .versionCode "$metadata")" = "$VERSION_CODE"
          test "$(jq -r .packageId "$metadata")" = "sh.paseo.iexalt"
          test "$(jq -r .abi "$metadata")" = "arm64-v8a"
          test "$(jq -r .runId "$metadata")" = "$GITHUB_RUN_ID"
          builder_attempt="$(jq -er '.runAttempt' "$metadata")"
          [[ "$builder_attempt" =~ ^[1-9][0-9]*$ ]]
          (( builder_attempt == GITHUB_RUN_ATTEMPT ))

          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK is not installed on this runner}}"
          apksigner="$android_home/build-tools/36.0.0/apksigner"
          apkanalyzer="$android_home/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apksigner"
          test -x "$apkanalyzer"

          final_dir="$RUNNER_TEMP/fork-apk-final"
          mkdir -p "$final_dir"
          final_apk="$final_dir/paseo-iexalt-fork-${VERSION_CODE}.apk"
          "$apksigner" sign --key "$key_file" --cert "$cert_file" --out "$final_apk" "$candidate"
          test "$(stat -c%s "$final_apk")" -le 536870912
          "$apksigner" verify --verbose "$final_apk"
          certificate_report="$("$apksigner" verify --print-certs "$final_apk")"
          signer_count="$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: .*/x/p' | wc -l | tr -d ' ')"
          test "$signer_count" -eq 1
          verified_digest="$(printf '%s\n' "$certificate_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$verified_digest" = "$APPROVED_CERT_SHA256"
          test "$("$apkanalyzer" manifest application-id "$final_apk")" = "sh.paseo.iexalt"
          test "$("$apkanalyzer" manifest version-code "$final_apk")" = "$VERSION_CODE"
          test "$("$apkanalyzer" manifest version-name "$final_apk")" = "$FORK_VERSION"
          test "$("$apkanalyzer" manifest debuggable "$final_apk")" = "false"
          final_abis="$(unzip -Z1 "$final_apk" | awk -F/ '$1 == "lib" && NF >= 3 { print $2 }' | sort -u)"
          test "$final_abis" = "arm64-v8a"

          jq \
            --arg signingRunId "$GITHUB_RUN_ID" \
            --arg signingRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg signingCertificateSha256 "$verified_digest" \
            --arg apkSha256 "$(sha256sum "$final_apk" | cut -d' ' -f1)" \
            '. + {signingRunId: $signingRunId, signingRunAttempt: $signingRunAttempt, signingCertificateSha256: $signingCertificateSha256, apkSha256: $apkSha256}' \
            "$metadata" > "$final_dir/build-metadata.json"
          (cd "$final_dir" && sha256sum "$(basename "$final_apk")" build-metadata.json > SHA256SUMS)
          apk_sha256="$(sha256sum "$final_apk" | cut -d' ' -f1)"
          metadata_sha256="$(sha256sum "$final_dir/build-metadata.json" | cut -d' ' -f1)"
          artifact_name="paseo-iexalt-${VERSION_CODE}-${SOURCE_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "fork_version=$FORK_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "package_id=sh.paseo.iexalt"
            echo "signing_certificate_sha256=$verified_digest"
            echo "apk_sha256=$apk_sha256"
            echo "metadata_sha256=$metadata_sha256"
            echo "artifact_name=$artifact_name"
            echo "verified=true"
          } >> "$GITHUB_OUTPUT"
          echo "final_dir=$final_dir" >> "$GITHUB_OUTPUT"
          echo "Fork APK signed and verified against the approved certificate."

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fork-signing-key.pk8.pem" "$RUNNER_TEMP/fork-signing-key.pk8.der" "$RUNNER_TEMP/fork-signing-cert.pem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-final
        with:
          name: ${{ steps.signed.outputs.artifact_name }}
          path: ${{ steps.signed.outputs.final_dir }}/
          if-no-files-found: error
          retention-days: 1
