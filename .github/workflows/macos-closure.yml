name: macOS Nix closure

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
      source_sha:
        description: Immutable commit SHA to build.
        required: true
        type: string
      fork_version:
        description: Canonical semver matching the immutable source package.
        required: true
        type: string
    secrets:
      PASEO_NIX_RELEASE_SIGNING_KEY:
        description: Scoped Nix store signing key; exposed only to the export/sign step.
        required: true
    outputs:
      source_sha:
        description: Immutable source SHA verified by the producer and consumer.
        value: ${{ jobs.build-and-export.outputs.source_sha }}
      fork_version:
        description: Canonical fork version verified by the producer and consumer.
        value: ${{ jobs.build-and-export.outputs.fork_version }}
      lock_hash:
        description: SHA-256 of the source flake.lock.
        value: ${{ jobs.build-and-export.outputs.lock_hash }}
      output_path:
        description: Nix store output path for the desktop closure.
        value: ${{ jobs.build-and-export.outputs.output_path }}
      manifest_path:
        description: Producer-pinned content-addressed closure manifest path.
        value: ${{ jobs.build-and-export.outputs.manifest_path }}
      manifest_sha256:
        description: SHA-256 of the public closure metadata artifact.
        value: ${{ jobs.build-and-export.outputs.manifest_sha256 }}
      artifact_name:
        description: Name of the signed closure artifact.
        value: ${{ jobs.build-and-export.outputs.artifact_name }}
      archive_sha256:
        description: SHA-256 of the signed binary-cache archive.
        value: ${{ jobs.build-and-export.outputs.archive_sha256 }}
      artifact_id:
        description: GitHub Actions artifact ID for downstream packaging.
        value: ${{ jobs.build-and-export.outputs.artifact_id }}
      artifact_digest:
        description: GitHub Actions artifact digest for downstream validation.
        value: ${{ jobs.build-and-export.outputs.artifact_digest }}
      verified:
        description: Whether the fresh-runner import and signature verification passed.
        value: ${{ jobs.verify-import.outputs.verified }}

permissions:
  contents: read
  actions: read

env:
  PASEO_CANDIDATE_SHA: ${{ inputs.source_sha }}

concurrency:
  group: macos-nix-closure-${{ inputs.source_sha }}-${{ inputs.fork_version }}
  cancel-in-progress: false

jobs:
  authorize-import:
    needs: [build-and-export]
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: mac-import

  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: mac-build

  build-and-export:
    needs: [authorize]
    name: Build and sign macOS closure
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      fork_version: ${{ steps.prepare.outputs.fork_version }}
      lock_hash: ${{ steps.prepare.outputs.lock_hash }}
      output_path: ${{ steps.prepare.outputs.output_path }}
      manifest_path: ${{ steps.build.outputs.manifest_path }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
      artifact_name: ${{ steps.export.outputs.artifact_name }}
      archive_name: ${{ steps.export.outputs.archive_name }}
      archive_bytes: ${{ steps.export.outputs.archive_bytes }}
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
      cache_bytes: ${{ steps.export.outputs.cache_bytes }}
      cache_file_count: ${{ steps.export.outputs.cache_file_count }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: mac-build
      CANDIDATE_EXPECTED_JOB: paired / Build and verify macOS closure / Build and sign macOS closure
    steps:
      - name: Read trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        id: authority
        env:
          CANDIDATE_EXPECTED_JOB: paired / Build and verify macOS closure / Build and sign macOS closure
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Import the pinned Node seed and verify source identity
        id: prepare
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORK_VERSION: ${{ inputs.fork_version }}
        run: bash .github/scripts/nix-release-closure.sh prepare

      - name: Build the macOS desktop output
        id: build
        timeout-minutes: 60
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORK_VERSION: ${{ inputs.fork_version }}
        run: bash .github/scripts/observe-macos-build.sh

      - name: Sign and export the closure
        id: export
        timeout-minutes: 10
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORK_VERSION: ${{ inputs.fork_version }}
          NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}
          NIX_RELEASE_PUBLIC_KEY: paseo-nix-release-1:hOc4RkmgnDMh/+aZWDdwQKuZHDVvVPh0Fya+DNAA+b8=
        run: bash .github/scripts/nix-release-closure.sh export-signed-closure

      - name: Remove temporary Nix signing key file
        id: remove-key
        if: always()
        run: rm -f "$RUNNER_TEMP/paseo-nix-release-secret-key"

      - name: Upload public closure and metadata artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/paseo-nix-release-artifact/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Bind step proof to this run attempt
        id: proof-subject
        if: steps.authority.outcome == 'success' && steps.source.outcome == 'success' && steps.prepare.outcome == 'success' && steps.build.outcome == 'success' && steps.export.outcome == 'success' && steps.remove-key.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          PROOF_SLOT: paired-macos-build
        shell: bash
        run: |
          [[ "$PROOF_SLOT" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]
          subject="$RUNNER_TEMP/paseo-step-proof-$PROOF_SLOT"
          printf 'paseo-step-proof-v1\n%s\n%s\n%s\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROOF_SLOT" > "$subject"
          { echo "subject=$subject"; echo "slot=$PROOF_SLOT"; } >> "$GITHUB_OUTPUT"
      - name: Sign step proof
        if: steps.proof-subject.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.proof-subject.outputs.subject }}
          predicate-type: https://github.com/iExalt/paseo/attestations/step-proof/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-step-proof","repository":"{0}","runId":{1},"attempt":{2},"slot":"{3}","evidence":{4}}}', github.repository, github.run_id, github.run_attempt, steps.proof-subject.outputs.slot, 'null') }}
          show-summary: false

  verify-import:
    needs: [build-and-export, authorize-import]
    name: Verify closure on a fresh runner
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize-import.outputs.artifact_id }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize-import.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: mac-import
      CANDIDATE_EXPECTED_JOB: paired / Build and verify macOS closure / Verify closure on a fresh runner
    steps:
      - name: Read trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        id: authority
        env:
          CANDIDATE_EXPECTED_JOB: paired / Build and verify macOS closure / Verify closure on a fresh runner
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authority.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.build-and-export.outputs.artifact_id }}
          path: ${{ runner.temp }}/paseo-nix-release-artifact
          merge-multiple: true

      - name: Import and verify signed closure
        id: verify
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FORK_VERSION: ${{ inputs.fork_version }}
          EXPECTED_SOURCE_SHA: ${{ needs.build-and-export.outputs.source_sha }}
          EXPECTED_FORK_VERSION: ${{ needs.build-and-export.outputs.fork_version }}
          EXPECTED_LOCK_HASH: ${{ needs.build-and-export.outputs.lock_hash }}
          EXPECTED_OUTPUT_PATH: ${{ needs.build-and-export.outputs.output_path }}
          EXPECTED_MANIFEST_PATH: ${{ needs.build-and-export.outputs.manifest_path }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.build-and-export.outputs.manifest_sha256 }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.build-and-export.outputs.artifact_name }}
          EXPECTED_ARCHIVE_NAME: ${{ needs.build-and-export.outputs.archive_name }}
          EXPECTED_ARCHIVE_BYTES: ${{ needs.build-and-export.outputs.archive_bytes }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-and-export.outputs.archive_sha256 }}
          EXPECTED_CACHE_BYTES: ${{ needs.build-and-export.outputs.cache_bytes }}
          EXPECTED_CACHE_FILE_COUNT: ${{ needs.build-and-export.outputs.cache_file_count }}
          NIX_RELEASE_PUBLIC_KEY: paseo-nix-release-1:hOc4RkmgnDMh/+aZWDdwQKuZHDVvVPh0Fya+DNAA+b8=
          ARTIFACT_DIR: ${{ runner.temp }}/paseo-nix-release-artifact
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" == "$SOURCE_SHA" ]] || { echo "::error::Producer source SHA differs from the requested source."; exit 1; }
          [[ "$EXPECTED_FORK_VERSION" == "$FORK_VERSION" ]] || { echo "::error::Producer fork version differs from the requested fork version."; exit 1; }
          bash .github/scripts/nix-release-closure.sh verify-import
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Bind step proof to this run attempt
        id: proof-subject
        if: steps.authority.outcome == 'success' && steps.source.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          PROOF_SLOT: paired-macos-import
        shell: bash
        run: |
          [[ "$PROOF_SLOT" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]
          subject="$RUNNER_TEMP/paseo-step-proof-$PROOF_SLOT"
          printf 'paseo-step-proof-v1\n%s\n%s\n%s\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROOF_SLOT" > "$subject"
          { echo "subject=$subject"; echo "slot=$PROOF_SLOT"; } >> "$GITHUB_OUTPUT"
      - name: Sign step proof
        if: steps.proof-subject.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.proof-subject.outputs.subject }}
          predicate-type: https://github.com/iExalt/paseo/attestations/step-proof/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-step-proof","repository":"{0}","runId":{1},"attempt":{2},"slot":"{3}","evidence":{4}}}', github.repository, github.run_id, github.run_attempt, steps.proof-subject.outputs.slot, 'null') }}
          show-summary: false
