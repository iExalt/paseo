name: Trusted candidate product transfer

on:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
      group:
        type: string
        required: true
      candidate_pin:
        type: string
        default: ""
      artifact_id:
        type: string
        default: ""
      artifact_digest:
        type: string
        default: ""

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read trusted controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Verify completed producer and admit exact package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_CANDIDATE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          CANDIDATE_PIN: ${{ inputs.candidate_pin }}
          CANDIDATE_PLATFORM: ${{ inputs.group == 'macos-arm64' && 'macos' || 'android' }}
          CANDIDATE_PRODUCT_GROUP: ${{ inputs.group }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: |
          case "$CANDIDATE_PRODUCT_GROUP" in
            macos-arm64|android-arm64) node .github/scripts/candidate-paired-transfer.mjs ;;
            *) node .github/scripts/candidate-product-transfer.mjs ;;
          esac
