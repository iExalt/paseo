
on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  cancel-in-progress: false

jobs:
    timeout-minutes: 5
    steps:
        with:
          client-id: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASEO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
  # A version bump no longer changes the Nix dependency hash, so this pushes
  # nothing unless a dependency change landed without its hash. It stays as
  # that safety net, so a stale hash fails here instead of in the release.
          node-version: "26.13.0"
        env:
