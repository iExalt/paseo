name: Release Please

# Keeps one release PR open that bumps the version and writes CHANGELOG.fork.md
# from the Conventional Commits on dev. Merging it makes the paseo-v* tag and a
# draft release with the changelog as its notes, and the dispatch job starts
# release.yml on dev, which builds, fills and publishes the draft. The release
# App's token is used for the PR, not GITHUB_TOKEN: what GITHUB_TOKEN pushes
# starts no workflows, so the release PR would get no checks. A dispatch is the
# exception, so GITHUB_TOKEN starts the release.
on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'iExalt/paseo'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASEO_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: dev

  # On dev, not the tag, so the Android caches the release saves stay readable
  # by the next one; see release.yml.
  dispatch:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the release on dev
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref dev -f tag="$TAG"

  # A version bump no longer changes the Nix dependency hash, so this pushes
  # nothing unless a dependency change landed without its hash. It stays as
  # that safety net, so a stale hash fails here instead of in the release.
  nix-hash:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASEO_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.36.0/install
          install_sha256: 8388dfd4d3c3a0c2dc79f764d453eafcc244255f47c93c1958f4775af22f0353
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: bash scripts/update-nix.sh
      - name: Push the refreshed hash
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git diff --quiet package-lock.json nix/npm-deps.hash && exit 0
          # GitHub signs API-created commits; unsigned PR heads can block even squash merges.
          HEAD_OID="$(git rev-parse HEAD)" node <<'NODE' | gh api graphql --input - | jq -er '.data.createCommitOnBranch.commit | if .signature.isValid then .oid else error("Refresh commit is not Verified") end'
          const { readFileSync } = require("node:fs");
          process.stdout.write(JSON.stringify({
            query: `mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid signature { isValid } } }
            }`,
            variables: { input: {
              branch: {
                repositoryNameWithOwner: process.env.GITHUB_REPOSITORY,
                branchName: process.env.BRANCH,
              },
              expectedHeadOid: process.env.HEAD_OID,
              message: { headline: "chore(nix): refresh the npm dependency hash" },
              fileChanges: { additions: ["package-lock.json", "nix/npm-deps.hash"].map(path => ({
                path, contents: readFileSync(path).toString("base64"),
              })) },
            } },
          }));
          NODE
