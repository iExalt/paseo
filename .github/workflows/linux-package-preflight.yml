name: Linux package preflight

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to evaluate without building
        required: true
        type: choice
        default: x64
        options: [x64, arm64]

permissions:
  contents: read

concurrency:
  group: linux-package-preflight
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false
      - name: Evaluate exact native source without realizing packages
        timeout-minutes: 8
        run: bash .github/scripts/linux-package-preflight.sh
