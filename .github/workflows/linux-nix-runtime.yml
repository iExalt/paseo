name: Linux Nix runtime

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to build and verify
        type: choice
        required: true
        default: x64
        options: [x64, arm64]

permissions:
  contents: read

concurrency:
  group: linux-nix-runtime-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false
            max-jobs = 2
            cores = 2
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Verify Nix source invalidation rules before building
        timeout-minutes: 1
        run: |
          nix eval --raw --no-update-lock-file --impure --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath' >/dev/null
          node scripts/nix-source-filter.test.mjs
      - name: Build exact native predecessor and candidate packages
        timeout-minutes: 35
        run: bash .github/scripts/linux-nix-build.sh
      - name: Install harness dependencies
        timeout-minutes: 3
        run: |
          npm ci --no-audit --no-fund
          npm run build:server
      - name: Replace owned Nix profile and verify retained desktop state
        timeout-minutes: 5
        run: node .github/scripts/linux-nix-runtime.mjs
      - name: Bound retained diagnostics
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          directory=.dev/github-workflows/linux-nix
          test -d "$directory"
          test "$(du -sb "$directory" | cut -f1)" -le 26214400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        with:
          name: linux-nix-${{ inputs.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .dev/github-workflows/linux-nix/
          retention-days: 1
          if-no-files-found: error
