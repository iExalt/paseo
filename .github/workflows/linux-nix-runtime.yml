name: Linux Nix runtime

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
    secrets:
      PASEO_NIX_RELEASE_SIGNING_KEY:
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.native.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.native.outputs.artifact_digest }}
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to build and verify
        type: choice
        required: true
        default: x64
        options: [x64, arm64]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: linux-nix-runtime-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: linux-nix-${{ inputs.architecture }}

  native:
    needs: [authorize]
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || inputs.source_sha == '') && (github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && (github.actor == 'iExalt' || (inputs.source_sha != '' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'))) }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
      artifact_digest: ${{ steps.packages.outputs.artifact-digest }}
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_LIVE_NATIVE: ${{ vars.PASEO_CANDIDATE_NATIVE_ENABLED }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: linux-nix-${{ inputs.architecture }}
      CANDIDATE_EXPECTED_JOB: linux-nix (${{ inputs.architecture }}) / native
      PASEO_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.11.0
          cache: false
      - name: Authenticate candidate and admitted attempt
        if: inputs.source_sha != ''
        id: candidate
        env:
          CANDIDATE_EXPECTED_JOB: linux-nix (${{ inputs.architecture }}) / native
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        id: source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.7/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false
            max-jobs = 2
            cores = 2
      - name: Verify Nix source invalidation rules before building
        timeout-minutes: 1
        run: |
          nix eval --raw --no-update-lock-file --impure --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath' >/dev/null
          node scripts/nix-source-filter.test.mjs
      - name: Build exact native predecessor and candidate packages
        timeout-minutes: 35
        run: bash .github/scripts/linux-nix-build.sh
      - name: Install harness dependencies
        timeout-minutes: 3
        run: |
          npm ci --no-audit --no-fund
          npm run build:server
      - name: Replace owned Nix profile and verify retained desktop state
        id: verify
        timeout-minutes: 5
        run: node .github/scripts/linux-nix-runtime.mjs
      - name: Export and verify signed native closures
        if: inputs.source_sha != ''
        id: export
        timeout-minutes: 8
        env:
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}
        run: node .github/scripts/candidate-nix-export.mjs
      - name: Remove owned temporary Nix signing key
        id: remove-key
        if: always() && inputs.source_sha != ''
        timeout-minutes: 1
        run: rm -f -- "$RUNNER_TEMP/candidate-nix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/signing-key"
      - name: Transfer immutable candidate closures
        if: inputs.source_sha != ''
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-linux-nix-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.export.outputs.directory }}/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Bind step proof to this run attempt
        id: proof-subject
        if: steps.candidate.outcome == 'success' && steps.source.outcome == 'success' && steps.verify.outcome == 'success' && steps.export.outcome == 'success' && steps.remove-key.outcome == 'success' && steps.packages.outcome == 'success'
        env:
          PROOF_SLOT: producer-linux-nix-${{ inputs.architecture }}
        shell: bash
        run: |
          [[ "$PROOF_SLOT" =~ ^[a-z0-9][a-z0-9-]{0,79}$ ]]
          subject="$RUNNER_TEMP/paseo-step-proof-$PROOF_SLOT"
          printf 'paseo-step-proof-v1\n%s\n%s\n%s\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROOF_SLOT" > "$subject"
          { echo "subject=$subject"; echo "slot=$PROOF_SLOT"; } >> "$GITHUB_OUTPUT"
      - name: Sign step proof
        if: steps.proof-subject.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.proof-subject.outputs.subject }}
          predicate-type: https://github.com/iExalt/paseo/attestations/step-proof/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-step-proof","repository":"{0}","runId":{1},"attempt":{2},"slot":"{3}","evidence":{4}}}', github.repository, github.run_id, github.run_attempt, steps.proof-subject.outputs.slot, format('{{"artifactId":{0},"artifactDigest":"{1}"}}', steps.packages.outputs.artifact-id, steps.packages.outputs.artifact-digest)) }}
          show-summary: false
      - name: Bound retained diagnostics
        id: evidence
        if: ${{ !cancelled() }}
        run: |
          directory=.dev/github-workflows/linux-nix
          test -d "$directory"
          test "$(du -sb "$directory" | cut -f1)" -le 26214400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        with:
          name: linux-nix-${{ inputs.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .dev/github-workflows/linux-nix/
          retention-days: 3
          if-no-files-found: error
