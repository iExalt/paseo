name: Fork release candidate

on:
  pull_request_target:
    types: [closed]
    branches: [dev]
    # Bound by candidateTriggerPaths: every accepted source changes one of them.
    paths: [.github/fork-release.json, .github/pending-candidate-replacement.json]
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing authenticated candidate draft ID to retry
        required: false
        type: string
      merged_pr:
        description: Authenticated merged release PR for initial issuance (exclusive with draft ID)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: paseo-release-candidate-control
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'iExalt/paseo' && !github.event.repository.private &&
      github.ref == 'refs/heads/dev' &&
      ((github.event_name == 'pull_request_target' && github.event.pull_request.merged &&
        github.event.pull_request.user.id == 341220930) ||
       (github.event_name == 'workflow_dispatch' && github.actor == 'iExalt'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: read
      attestations: read
    outputs:
      digest: ${{ steps.authority.outputs.descriptor_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Verify merged source or authenticated retry
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MODE: plan
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-entry.mjs

  issue:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: read
      attestations: read
    outputs:
      release_id: ${{ steps.authority.outputs.release_id }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
      version: ${{ steps.authority.outputs.version }}
      descriptor_digest: ${{ steps.authority.outputs.descriptor_digest }}
      # Reruns re-read repository variables; carry the issued decision instead
      # so one candidate run never mixes native and non-native attempts.
      native: ${{ vars.PASEO_CANDIDATE_NATIVE_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Independently revalidate and issue draft authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MODE: issue
          EXPECTED_DESCRIPTOR_DIGEST: ${{ needs.plan.outputs.digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
          PASEO_RELEASE_MANIFEST_PRIVATE_KEY: ${{ (github.event_name == 'pull_request_target' || (inputs.merged_pr != '' && inputs.release_id == '')) && secrets.PASEO_RELEASE_MANIFEST_PRIVATE_KEY || '' }}
        run: node .github/scripts/candidate-entry.mjs

  verify:
    needs: issue
    uses: ./.github/workflows/candidate-verify.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}

  paired:
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/fork-builds.yml
    permissions:
      packages: read
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
    secrets:
      PASEO_NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}
      PASEO_FORK_GOOGLE_SERVICES_JSON: ${{ secrets.PASEO_FORK_GOOGLE_SERVICES_JSON }}
      PASEO_FORK_SIGNING_KEY_PKCS8_PEM: ${{ secrets.PASEO_FORK_SIGNING_KEY_PKCS8_PEM }}
      PASEO_FORK_SIGNING_CERT_PEM: ${{ secrets.PASEO_FORK_SIGNING_CERT_PEM }}

  native-runtime:
    needs: [issue, paired]
    uses: ./.github/workflows/candidate-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      candidate_pin: >-
        ${{ format('{{"runId":"{0}","attempt":"{1}","sourceSha":"{2}","version":"{3}","artifactId":"{4}","artifactDigest":"{5}"}}', github.run_id, needs.paired.outputs.attempt, needs.issue.outputs.source_sha, needs.issue.outputs.version, needs.paired.outputs.artifact_id, needs.paired.outputs.artifact_digest) }}

  linux-nix-x64:
    name: linux-nix (x64)
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/linux-nix-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      architecture: x64
    secrets:
      PASEO_NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}

  transfer-linux-nix-x64:
    needs: [issue, linux-nix-x64]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: linux-nix-x64
      artifact_id: ${{ needs.linux-nix-x64.outputs.artifact_id }}
      artifact_digest: ${{ needs.linux-nix-x64.outputs.artifact_digest }}

  linux-nix-arm64:
    name: linux-nix (arm64)
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/linux-nix-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      architecture: arm64
    secrets:
      PASEO_NIX_RELEASE_SIGNING_KEY: ${{ secrets.PASEO_NIX_RELEASE_SIGNING_KEY }}

  transfer-linux-nix-arm64:
    needs: [issue, linux-nix-arm64]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: linux-nix-arm64
      artifact_id: ${{ needs.linux-nix-arm64.outputs.artifact_id }}
      artifact_digest: ${{ needs.linux-nix-arm64.outputs.artifact_digest }}

  linux-products-x64:
    name: linux-products (x64)
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/linux-product-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      architecture: x64

  transfer-linux-products-x64:
    needs: [issue, linux-products-x64]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: linux-products-x64
      artifact_id: ${{ needs.linux-products-x64.outputs.artifact_id }}
      artifact_digest: ${{ needs.linux-products-x64.outputs.artifact_digest }}

  linux-products-arm64:
    name: linux-products (arm64)
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/linux-product-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      architecture: arm64

  transfer-linux-products-arm64:
    needs: [issue, linux-products-arm64]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: linux-products-arm64
      artifact_id: ${{ needs.linux-products-arm64.outputs.artifact_id }}
      artifact_digest: ${{ needs.linux-products-arm64.outputs.artifact_digest }}

  windows-x64:
    name: windows (x64)
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/windows-product-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      architecture: x64

  transfer-windows-x64:
    needs: [issue, windows-x64]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: windows-x64
      artifact_id: ${{ needs.windows-x64.outputs.artifact_id }}
      artifact_digest: ${{ needs.windows-x64.outputs.artifact_digest }}

  windows-arm64:
    name: windows (arm64)
    needs: [issue, verify]
    if: needs.issue.outputs.native == 'true'
    uses: ./.github/workflows/windows-product-runtime.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      architecture: arm64

  transfer-windows-arm64:
    needs: [issue, windows-arm64]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: windows-arm64
      artifact_id: ${{ needs.windows-arm64.outputs.artifact_id }}
      artifact_digest: ${{ needs.windows-arm64.outputs.artifact_digest }}

  transfer-macos:
    needs: [issue, paired, native-runtime]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: macos-arm64
      candidate_pin: >-
        ${{ format('{{"runId":"{0}","attempt":"{1}","sourceSha":"{2}","version":"{3}","artifactId":"{4}","artifactDigest":"{5}"}}', github.run_id, needs.paired.outputs.attempt, needs.issue.outputs.source_sha, needs.issue.outputs.version, needs.paired.outputs.artifact_id, needs.paired.outputs.artifact_digest) }}

  transfer-android:
    needs: [issue, paired, native-runtime]
    uses: ./.github/workflows/candidate-transfer.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    with:
      release_id: ${{ needs.issue.outputs.release_id }}
      source_sha: ${{ needs.issue.outputs.source_sha }}
      descriptor_digest: ${{ needs.issue.outputs.descriptor_digest }}
      group: android-arm64
      candidate_pin: >-
        ${{ format('{{"runId":"{0}","attempt":"{1}","sourceSha":"{2}","version":"{3}","artifactId":"{4}","artifactDigest":"{5}"}}', github.run_id, needs.paired.outputs.attempt, needs.issue.outputs.source_sha, needs.issue.outputs.version, needs.paired.outputs.artifact_id, needs.paired.outputs.artifact_digest) }}

  aggregate:
    needs:
      [
        issue,
        verify,
        transfer-linux-nix-x64,
        transfer-linux-nix-arm64,
        transfer-linux-products-x64,
        transfer-linux-products-arm64,
        transfer-windows-x64,
        transfer-windows-arm64,
        transfer-macos,
        transfer-android,
      ]
    # A failed producer leaves aggregate skipped rather than a second red job;
    # "Re-run failed jobs" still reruns it as a dependent.
    if: ${{ !failure() && !cancelled() && needs.issue.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PASEO_CANDIDATE_SHA: ${{ needs.issue.outputs.source_sha }}
      CANDIDATE_RELEASE_ID: ${{ needs.issue.outputs.release_id }}
      CANDIDATE_DESCRIPTOR_DIGEST: ${{ needs.issue.outputs.descriptor_digest }}
      CANDIDATE_NATIVE_ENABLED: ${{ needs.issue.outputs.native }}
      PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
      PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
      PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
      PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
    steps:
      - name: Read trusted controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Independently verify complete current-attempt draft bytes
        id: verified
        run: node .github/scripts/candidate-aggregate.mjs verify
      - name: Revalidate admission and sign unpublished inventory
        env:
          VERIFIED_MANIFEST_DIGEST: ${{ steps.verified.outputs.manifest_digest }}
          VERIFIED_EVIDENCE_DIGEST: ${{ steps.verified.outputs.evidence_digest }}
          PASEO_RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.PASEO_RELEASE_MANIFEST_PRIVATE_KEY }}
        run: node .github/scripts/candidate-aggregate.mjs sign
