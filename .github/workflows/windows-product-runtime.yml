name: Windows product formats

on:
  workflow_call:
    inputs:
      architecture:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      release_id:
        type: string
        required: true
      descriptor_digest:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.native.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.native.outputs.artifact_digest }}
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture for installed NSIS upgrade and speech proof
        type: choice
        required: true
        default: arm64
        options: [arm64, x64]
      verify_cache_transfer:
        description: Require a fresh-runner predecessor cache transfer proof after this build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.source_sha && format('candidate-products-{0}-{1}', 'windows', inputs.architecture) || 'paseo-predecessor-cache-writer' }}
  cancel-in-progress: false

jobs:
  authorize:
    if: inputs.source_sha != ''
    uses: ./.github/workflows/candidate-auth.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      release_id: ${{ inputs.release_id }}
      source_sha: ${{ inputs.source_sha }}
      descriptor_digest: ${{ inputs.descriptor_digest }}
      group: windows-${{ inputs.architecture }}

  native:
    needs: [authorize]
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    if: ${{ !cancelled() && (needs.authorize.result == 'success' || inputs.source_sha == '') && (github.repository == 'iExalt/paseo' && !github.event.repository.private && github.ref == 'refs/heads/dev' && (github.actor == 'iExalt' || (inputs.source_sha != '' && github.workflow_ref == 'iExalt/paseo/.github/workflows/release-candidate.yml@refs/heads/dev'))) }}
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 150
    outputs:
      artifact_id: ${{ steps.packages.outputs.artifact-id }}
      artifact_digest: ${{ steps.packages.outputs.artifact-digest }}
      predecessor_key: ${{ steps.predecessor.outputs.key }}
      cache_saved: ${{ steps.predecessor-save.outcome == 'success' }}
    defaults:
      run:
        shell: pwsh
    env:
      CANDIDATE_GRANT_ID: ${{ needs.authorize.outputs.artifact_id }}
      CANDIDATE_LIVE_NATIVE: ${{ vars.PASEO_CANDIDATE_NATIVE_ENABLED }}
      CANDIDATE_GRANT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
      CANDIDATE_GRANT_GROUP: windows-${{ inputs.architecture }}
      CANDIDATE_EXPECTED_JOB: windows (${{ inputs.architecture }}) / native
      PASEO_CANDIDATE_SHA: ${{ inputs.source_sha || github.sha }}
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
      CI: "true"
      LEFTHOOK: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Reserve time for cleanup before the whole-job deadline
        run: '"PASEO_WINDOWS_DEADLINE=$([DateTimeOffset]::UtcNow.AddMinutes(143).ToUnixTimeSeconds())" >> $env:GITHUB_ENV'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          architecture: ${{ inputs.architecture }}
          package-manager-cache: false
      - name: Authenticate candidate and admitted attempt
        if: inputs.source_sha != ''
        id: candidate
        env:
          CANDIDATE_EXPECTED_JOB: windows (${{ inputs.architecture }}) / native
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
          PASEO_RELEASE_APP_ID: ${{ vars.PASEO_RELEASE_APP_ID }}
          PASEO_RELEASE_APP_CLIENT_ID: ${{ vars.PASEO_RELEASE_APP_CLIENT_ID }}
          PASEO_RELEASE_BOT_ID: ${{ vars.PASEO_RELEASE_BOT_ID }}
          PASEO_RELEASE_BOT_LOGIN: ${{ vars.PASEO_RELEASE_BOT_LOGIN }}
        run: node .github/scripts/candidate-worker.mjs
      - name: Read authenticated candidate source
        id: source
        if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated native build storage
        timeout-minutes: 3
        run: ./.github/scripts/windows-product-storage.ps1 setup
      - name: Bind exact sources and clean installation scope
        run: |
          ./.github/scripts/windows-product-stage.ps1 init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/windows-product-runtime.ps1 prepare
      - name: Install candidate locked dependencies normally
        timeout-minutes: 30
        run: ./.github/scripts/windows-product-stage.ps1 install-candidate
      - name: Build the pinned ARM Electron speech binding once
        timeout-minutes: 16
        run: ./.github/scripts/windows-product-stage.ps1 binding
      - name: Build the candidate native NSIS payload once
        timeout-minutes: 30
        run: ./.github/scripts/windows-product-stage.ps1 build-candidate
      - name: Bind immutable predecessor cache recipe
        id: predecessor
        run: node .github/scripts/windows-predecessor-cache.mjs prepare
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: predecessor-cache
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ steps.predecessor.outputs.key }}
      - name: Verify and consume exact predecessor cache
        if: steps.predecessor-cache.outputs.cache-hit == 'true'
        env:
          PREDECESSOR_CACHE_MATCHED_KEY: ${{ steps.predecessor-cache.outputs.cache-matched-key }}
        run: node .github/scripts/windows-predecessor-cache.mjs restore
      - name: Install predecessor locked dependencies normally
        if: steps.predecessor-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ./.github/scripts/windows-product-stage.ps1 install-previous
      - name: Reconstruct the fixed predecessor NSIS payload once
        if: steps.predecessor-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: ./.github/scripts/windows-product-stage.ps1 build-previous
      - name: Download and verify pinned speech models
        timeout-minutes: 10
        run: ./.github/scripts/windows-product-runtime.ps1 models
      - name: Verify installed upgrade, retained CLI, PTY and real speech
        id: verify
        timeout-minutes: 17
        run: ./.github/scripts/windows-product-runtime.ps1 runtime
      - name: Reconcile owned processes and remove installation and state
        id: cleanup
        if: always()
        timeout-minutes: 3
        run: |
          ./.github/scripts/windows-product-runtime.ps1 cleanup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/windows-product-stage.ps1 cleanup
      - name: Stage verified predecessor within repository cache headroom
        if: success() && inputs.source_sha == '' && steps.predecessor-cache.outputs.cache-hit != 'true'
        id: cache-budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/windows-predecessor-cache.mjs stage
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: predecessor-save
        if: steps.cache-budget.outputs.save == 'true'
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ steps.predecessor.outputs.key }}
      - name: Remove owned build worktrees and isolated storage
        id: remove-storage
        if: always()
        timeout-minutes: 5
        run: ./.github/scripts/windows-product-storage.ps1 cleanup
      - name: Export verified candidate packages
        if: success() && inputs.source_sha != ''
        id: export
        env:
          CANDIDATE_CONTEXT: ${{ steps.candidate.outputs.context }}
          CANDIDATE_DESCRIPTOR_DIGEST: ${{ inputs.descriptor_digest }}
        run: node .github/scripts/candidate-product-export.mjs windows
      - name: Transfer immutable candidate packages
        if: success() && inputs.source_sha != ''
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-windows-products-${{ inputs.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.export.outputs.directory }}/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Bind step proof to this run attempt
        id: proof-subject
        if: steps.candidate.outcome == 'success' && steps.source.outcome == 'success' && steps.verify.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.remove-storage.outcome == 'success' && steps.export.outcome == 'success' && steps.packages.outcome == 'success'
        env:
          PROOF_SLOT: producer-windows-${{ inputs.architecture }}
        shell: pwsh
        run: |
          if ($env:PROOF_SLOT -cnotmatch '^[a-z0-9][a-z0-9-]{0,79}$') { throw 'Malformed proof slot' }
          $subject = Join-Path $env:RUNNER_TEMP "paseo-step-proof-$env:PROOF_SLOT"
          [IO.File]::WriteAllText($subject, "paseo-step-proof-v1`n$env:GITHUB_REPOSITORY`n$env:GITHUB_RUN_ID`n$env:GITHUB_RUN_ATTEMPT`n$env:PROOF_SLOT`n")
          "subject=$($subject.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          "slot=$env:PROOF_SLOT" >> $env:GITHUB_OUTPUT
      - name: Sign step proof
        if: steps.proof-subject.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.proof-subject.outputs.subject }}
          predicate-type: https://github.com/iExalt/paseo/attestations/step-proof/v1
          predicate: ${{ format('{{"schemaVersion":1,"kind":"paseo-step-proof","repository":"{0}","runId":{1},"attempt":{2},"slot":"{3}","evidence":{4}}}', github.repository, github.run_id, github.run_attempt, steps.proof-subject.outputs.slot, format('{{"artifactId":{0},"artifactDigest":"{1}"}}', steps.packages.outputs.artifact-id, steps.packages.outputs.artifact-digest)) }}
          show-summary: false
      - name: Bound retained diagnostics
        id: evidence
        if: always()
        run: ./.github/scripts/windows-product-stage.ps1 diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: windows-products-${{ inputs.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paseo-windows-products-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          retention-days: 3
          if-no-files-found: error

  cache-proof:
    needs: native
    if: always() && inputs.verify_cache_transfer && needs.native.result == 'success'
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_ARCHITECTURE: ${{ inputs.architecture }}
    steps:
      - name: Require the requested cache save
        env:
          CACHE_SAVED: ${{ needs.native.outputs.cache_saved }}
        run: if ($env:CACHE_SAVED -ne 'true') { throw 'Expected predecessor cache was not saved' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.11.0"
          architecture: ${{ inputs.architecture }}
          package-manager-cache: false
      - id: predecessor
        run: node .github/scripts/windows-predecessor-cache.mjs prepare-proof
      - name: Require the same producer recipe
        env:
          PRODUCER_KEY: ${{ needs.native.outputs.predecessor_key }}
          EXPECTED_KEY: ${{ steps.predecessor.outputs.key }}
        run: if ($env:PRODUCER_KEY -ne $env:EXPECTED_KEY) { throw 'Producer recipe mismatch' }
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: restored
        timeout-minutes: 3
        with:
          path: ${{ steps.predecessor.outputs.directory }}
          key: ${{ needs.native.outputs.predecessor_key }}
          fail-on-cache-miss: true
      - name: Validate and consume the actual restored installer and portable identity
        env:
          PREDECESSOR_CACHE_MATCHED_KEY: ${{ steps.restored.outputs.cache-matched-key }}
        run: node .github/scripts/windows-predecessor-cache.mjs restore-proof
      - name: Remove the proof predecessor checkout
        if: always()
        run: node .github/scripts/windows-predecessor-cache.mjs cleanup-proof
