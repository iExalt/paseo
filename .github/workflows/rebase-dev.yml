name: Rebase dev onto upstream mirror

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Validate the signed rebase without publishing any refs"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: rebase-dev
  cancel-in-progress: false

jobs:
  rebase:
    if: github.repository == 'iExalt/paseo' && github.ref == 'refs/heads/dev' && github.actor == 'iExalt'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      npm_config_audit: "false"
      npm_config_fund: "false"
    outputs:
      candidate-sha: ${{ steps.bundle.outputs.candidate-sha }}
      matrix: ${{ steps.bundle.outputs.matrix }}
      dev-sha: ${{ steps.rebase.outputs.dev-sha }}
      upstream-sha: ${{ steps.rebase.outputs.upstream-sha }}
      resolutions-sha: ${{ steps.rebase.outputs.resolutions-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.3"
          install_args: node@26.13.0 actionlint@1.7.12
          cache: false

      - name: Rebase captured dev on captured upstream and import known resolutions
        id: rebase
        run: node .github/scripts/rebase-dev.mjs
        env:
          REBASE_DEV_DIAGNOSTICS: ${{ runner.temp }}/rebase-dev-diagnostics.txt
          PASEO_REBASE_SSH_SIGNING_KEY: ${{ secrets.PASEO_REBASE_SSH_SIGNING_KEY }}

      - name: Bundle the exact rebased tree and captured inputs
        id: bundle
        run: |
          echo "candidate-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "matrix=$(node .github/scripts/ci-routine.mjs --matrix)" >> "$GITHUB_OUTPUT"
          git bundle create "$RUNNER_TEMP/rebased.bundle" HEAD --tags \
            refs/codex/snapshot/dev refs/codex/snapshot/upstream refs/codex/snapshot/resolutions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebased-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebased.bundle
          if-no-files-found: error
          retention-days: 1

      - name: Summarize bounded rebase diagnostics
        if: failure()
        env:
          REBASE_DEV_DIAGNOSTICS: ${{ runner.temp }}/rebase-dev-diagnostics.txt
        run: |
          if [[ -f "$REBASE_DEV_DIAGNOSTICS" ]]; then
            head -c 16000 "$REBASE_DEV_DIAGNOSTICS" >> "$GITHUB_STEP_SUMMARY"
          fi

  routine:
    name: Rebase routine (${{ matrix.lane }})
    needs: rebase
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.rebase.outputs.matrix) }}
    env:
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.rebase.outputs.dev-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rebased-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebase-input
      - name: Restore the captured candidate
        env:
          CANDIDATE_SHA: ${{ needs.rebase.outputs.candidate-sha }}
        run: |
          git fetch "$RUNNER_TEMP/rebase-input/rebased.bundle" \
            HEAD refs/codex/snapshot/dev:refs/codex/snapshot/dev \
            refs/codex/snapshot/upstream:refs/codex/snapshot/upstream \
            refs/codex/snapshot/resolutions:refs/codex/snapshot/resolutions
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: ./.github/actions/setup-ci-tools
        with:
          actionlint: "true"
      - name: Configure pinned npm installation
        run: |
          test "$(node --version)" = v26.13.0
          test "$(npm --version)" = 11.20.0
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"
      - name: Bind installed dependency cache key
        id: modules
        run: |
          key="$(NPM_VERSION="$(npm --version)" node .github/scripts/dependency-fingerprint.mjs routine-key)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore installed dependencies from dev
        id: restore-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 3
        with:
          key: ${{ steps.modules.outputs.key }}
          path: |
            node_modules
            packages/*/node_modules
      - name: Install locked dependencies once
        if: steps.restore-modules.outputs.cache-hit != 'true'
        env:
          npm_config_fetch_timeout: "30000"
          npm_config_fetch_retries: "2"
          npm_config_fetch_retry_mintimeout: "1000"
          npm_config_fetch_retry_maxtimeout: "5000"
        run: time npm ci --prefer-offline
      - name: Validate the exact rebased tree with a routine lane
        run: node .github/scripts/rebase-dev.mjs validate
        env:
          ROUTINE_LANE: ${{ matrix.lane }}
          TESTED_SHA: ${{ needs.rebase.outputs.candidate-sha }}

  validate:
    needs: [rebase, routine]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CI: "true"
      LEFTHOOK: "0"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.rebase.outputs.dev-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: rebased-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebase-input
      - name: Restore the captured candidate
        env:
          CANDIDATE_SHA: ${{ needs.rebase.outputs.candidate-sha }}
        run: |
          git fetch "$RUNNER_TEMP/rebase-input/rebased.bundle" \
            HEAD refs/codex/snapshot/dev:refs/codex/snapshot/dev \
            refs/codex/snapshot/upstream:refs/codex/snapshot/upstream \
            refs/codex/snapshot/resolutions:refs/codex/snapshot/resolutions
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: ./.github/actions/setup-ci-tools
      # Default success() on this job requires every routine lane to pass.
      - name: Bind publication to the validated candidate
        id: validate
        run: node .github/scripts/rebase-dev.mjs check-tree
        env:
          TESTED_SHA: ${{ needs.rebase.outputs.candidate-sha }}

      # GITHUB_TOKEN cannot push commits that change workflow files. Mint the
      # one-hour App token only for publication, once validation has passed.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        if: ${{ !inputs.validate_only }}
        with:
          client-id: ${{ vars.PASEO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASEO_SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Publish backup and rebased dev atomically
        if: ${{ !inputs.validate_only }}
        run: |
          rebase_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$rebase_auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $rebase_auth" \
          node .github/scripts/rebase-dev.mjs publish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TESTED_SHA: ${{ steps.validate.outputs.tested-sha }}
          DEV_SHA: ${{ needs.rebase.outputs.dev-sha }}
          UPSTREAM_SHA: ${{ needs.rebase.outputs.upstream-sha }}
          RESOLUTIONS_SHA: ${{ needs.rebase.outputs.resolutions-sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REBASE_DEV_DIAGNOSTICS: ${{ runner.temp }}/rebase-dev-diagnostics.txt

      - name: Summarize bounded rebase diagnostics
        if: failure()
        env:
          REBASE_DEV_DIAGNOSTICS: ${{ runner.temp }}/rebase-dev-diagnostics.txt
        run: |
          if [[ -f "$REBASE_DEV_DIAGNOSTICS" ]]; then
            head -c 16000 "$REBASE_DEV_DIAGNOSTICS" >> "$GITHUB_STEP_SUMMARY"
          fi
